<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b90f2e"><title>Crimson Notes — Your personal workspace</title>
<style>
:root{--red:#bd1234;--red2:#e32649;--deep:#850d27;--smoke:#f5f5f4;--paper:#fffdfd;--ink:#242126;--muted:#89828a;--line:#eee7e9;--pink:#fff0f2;--shadow:0 12px 34px #76122a12;--side:252px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7f8,#f4f3f2 60%,#fff);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0} .app{min-height:100vh;display:flex}
.sidebar{width:var(--side);position:fixed;inset:0 auto 0 0;background:#fffdfdf2;border-right:1px solid var(--line);padding:23px 17px;display:flex;flex-direction:column;z-index:5;backdrop-filter:blur(18px)}
.brand{padding:8px 12px 26px}.brand-mark{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,var(--red2),var(--deep));display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 7px 18px #bd123433}.brand h1{font-size:22px;margin:10px 0 0;letter-spacing:-.7px}.brand small{color:var(--muted)}
.nav-label{font-size:10px;letter-spacing:1.4px;color:#aaa0a5;font-weight:800;padding:15px 12px 7px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;background:transparent;color:#625b62;text-align:left;font-weight:600}.nav button:hover{background:#fff2f4;color:var(--red)}.nav button.active{background:linear-gradient(100deg,var(--red),#df3454);color:white;box-shadow:0 7px 18px #bd12342b}.ico{width:21px;text-align:center;font-size:18px}.side-bottom{margin-top:auto}.storage{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;margin:16px 0}.storage-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.bar{height:6px;background:#f1e8ea;border-radius:20px;margin-top:10px;overflow:hidden}.bar i{display:block;width:18%;height:100%;background:var(--red);border-radius:20px}
.main{margin-left:var(--side);width:calc(100% - var(--side));padding:22px 30px 42px;max-width:1700px}.topbar{display:flex;align-items:center;gap:15px;margin-bottom:24px}.search{position:relative;flex:1;max-width:650px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 17px 13px 44px;outline:none;box-shadow:0 3px 14px #2b17200a}.search input:focus{border-color:#e89aaa;box-shadow:0 0 0 3px #bd123411}.search span{position:absolute;left:16px;top:10px;font-size:19px;color:#817780}.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}.icon-btn{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#5f555c}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ffe3e8;color:var(--red);font-weight:800}
.btn{padding:11px 16px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;box-shadow:0 6px 15px #bd123425}.btn:hover{background:var(--deep)}.btn.light{background:white;color:var(--red);border:1px solid #f1d7dd;box-shadow:none}.btn.ghost{background:transparent;color:#6b6269;box-shadow:none}.btn.small{padding:8px 11px;font-size:13px}
.hero{border-radius:23px;padding:27px 30px;background:radial-gradient(circle at 85% 20%,#ef6680 0,transparent 30%),linear-gradient(110deg,#8f0b29,#c41439 58%,#e84965);color:white;position:relative;overflow:hidden;box-shadow:0 14px 32px #9f163122;margin-bottom:20px;min-height:180px}.hero:after{content:"";position:absolute;width:340px;height:340px;border:1px solid #ffffff35;border-radius:50%;right:8%;top:-180px;box-shadow:0 0 0 25px #ffffff09,0 0 0 55px #ffffff08}.hero h2{font-size:clamp(25px,3vw,36px);margin:0 0 7px;letter-spacing:-1px}.hero p{margin:0 0 19px;color:#ffe7eb;max-width:490px}.hero .btn{background:white;color:var(--red);box-shadow:none}.hero-art{position:absolute;right:7%;bottom:-22px;font-size:115px;opacity:.2;transform:rotate(-13deg)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}.quick button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 10px;color:#4b444a;box-shadow:var(--shadow);font-weight:650}.quick button span{display:block;font-size:23px;margin-bottom:5px;color:var(--red)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panel-head h3{margin:0;font-size:17px;letter-spacing:-.3px}.muted{color:var(--muted)}.link-btn{background:transparent;color:var(--red);font-weight:700}
.notebook-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.notebook{min-height:125px;border-radius:15px;padding:14px;color:white;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 1px #ffffff55;cursor:pointer;transition:.18s}.notebook:hover{transform:translateY(-3px)}.notebook:nth-child(4n+1){background:linear-gradient(145deg,#e62a4e,#a70d2c)}.notebook:nth-child(4n+2){background:linear-gradient(145deg,#f9dce2,#eaa6b5);color:#5a2634}.notebook:nth-child(4n+3){background:linear-gradient(145deg,#f8a33e,#e66b17)}.notebook:nth-child(4n){background:linear-gradient(145deg,#8f56c9,#54218f)}.notebook .emoji{font-size:25px}.notebook strong{font-size:14px}.notebook small{opacity:.8}
.task-row,.note-row{display:flex;align-items:center;gap:11px;padding:11px 2px;border-top:1px solid #f2edef}.task-row:first-of-type,.note-row:first-of-type{border-top:0}.task-check{width:19px;height:19px;border:2px solid #e6a1af;border-radius:50%;background:white;flex:none}.task-check.done{background:var(--red);border-color:var(--red);color:white}.task-main{flex:1;min-width:0}.task-main strong,.note-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.task-main small,.note-main small{color:var(--muted);font-size:11px}.pill{font-size:10px;padding:4px 8px;background:#fff0f2;color:var(--red);border-radius:20px}
.note-row{cursor:pointer}.note-thumb{width:39px;height:39px;border-radius:10px;background:#fff0f2;display:grid;place-items:center;color:var(--red);font-size:19px;flex:none}.note-main{flex:1;min-width:0}.empty{padding:26px;text-align:center;color:var(--muted)}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 19px}.page-title h2{margin:0;font-size:27px;letter-spacing:-.8px}.page-title p{margin:4px 0 0;color:var(--muted)}
.notes-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}.list-panel{padding:10px}.filterbar{display:flex;gap:6px;padding:5px 3px 12px;flex-wrap:wrap}.filterbar button{background:#f8f5f6;border-radius:20px;padding:7px 10px;font-size:11px;color:#766c73}.filterbar button.active{background:#ffe8ed;color:var(--red);font-weight:700}.note-card{padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent}.note-card:hover{background:#fff7f8}.note-card.active{background:#fff0f3;border-color:#f5d4dc}.note-card strong{display:block;font-size:13px}.note-card small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.editor{padding:22px 26px;min-height:610px}.editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:14px}.editor-title{font-size:26px;font-weight:800;border:0;outline:0;width:100%;color:var(--ink)}.editor-meta{display:flex;gap:8px;align-items:center;margin:13px 0;color:var(--muted);font-size:12px;flex-wrap:wrap}.editor-meta input{border:0;background:#faf7f8;padding:6px 9px;border-radius:8px;max-width:160px;outline:none}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line);margin-bottom:18px}.tool{min-width:34px;height:33px;border-radius:8px;background:#faf7f8;color:#514950;font-weight:700}.tool:hover{background:#ffe8ed;color:var(--red)}.content{min-height:390px;outline:0;line-height:1.8;font-size:15px}.content:empty:before{content:"Start writing your thoughts here…";color:#b6adb2}.content h1,.content h2,.content h3{line-height:1.3}.content blockquote{border-left:3px solid var(--red);padding:8px 14px;margin:14px 0;background:#fff5f6;color:#65545a;border-radius:0 9px 9px 0}.content img{max-width:100%;border-radius:12px}.content table{border-collapse:collapse;width:100%}.content td,.content th{border:1px solid var(--line);padding:8px}
.task-page{max-width:850px}.task-item{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid var(--line)}.task-item .task-main{flex:1}.task-item input[type=text]{border:0;outline:0;width:100%;font-weight:600}.task-item input[type=date]{border:1px solid var(--line);padding:6px;border-radius:8px;color:var(--muted);font-size:12px}
.modal-back{position:fixed;inset:0;background:#21151c66;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-back.show{display:flex}.modal{width:min(470px,100%);background:#fff;border-radius:20px;padding:23px;box-shadow:0 25px 80px #210b1c44}.modal h3{margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;outline:0;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#282126;color:white;padding:10px 17px;border-radius:12px;opacity:0;transition:.2s;z-index:30;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-menu{display:none}.bottom-nav{display:none}
body.dark{--smoke:#211d20;--paper:#292326;--ink:#f5edf0;--muted:#b6aab0;--line:#44383e;--pink:#39272e;background:#191518;color:var(--ink)}body.dark .sidebar,body.dark .panel,body.dark .search input,body.dark .quick button,body.dark .storage,body.dark .modal{background:#292326;color:var(--ink);border-color:#44383e}body.dark .nav button{color:#d0c4ca}body.dark .nav button.active{color:white}body.dark .notebook{color:white}body.dark .note-card:hover,body.dark .note-card.active,body.dark .filterbar button.active{background:#442832}body.dark .filterbar button,body.dark .tool,body.dark .editor-meta input,body.dark .editor-meta select{background:#362d32;color:#eee}body.dark .editor-title,body.dark .content{color:var(--ink);background:transparent}body.dark .bottom-nav{background:#292326ed;border-color:#44383e}body.dark .bottom-nav button{color:#ddd}body.dark .icon-btn{background:#30282d;border-color:#44383e;color:#eee}body.dark .task-check{background:#292326}body.dark .field input,body.dark .field select{background:#30282d;color:#fff;border-color:#51424a}
@media(max-width:1050px){:root{--side:215px}.main{padding:18px}.grid{grid-template-columns:1fr}.notebook-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:720px){.sidebar{display:none}.main{margin:0;width:100%;padding:13px 13px 90px}.topbar{gap:8px;margin-bottom:15px}.mobile-menu{display:grid}.top-actions .hide-mobile{display:none}.search input{padding:11px 10px 11px 37px;font-size:13px}.search span{left:12px;top:8px}.hero{padding:22px 20px;min-height:165px;border-radius:18px}.hero-art{right:0;font-size:80px}.quick{grid-template-columns:repeat(3,1fr);gap:8px}.quick button{padding:12px 5px;font-size:12px}.quick button span{font-size:20px}.panel{padding:15px}.notebook-grid{grid-template-columns:repeat(2,1fr)}.notebook{min-height:110px}.notes-layout{grid-template-columns:1fr}.list-panel{max-height:220px;overflow:auto}.editor{min-height:520px;padding:17px}.editor-title{font-size:22px}.bottom-nav{display:flex;position:fixed;bottom:9px;left:10px;right:10px;z-index:10;background:#ffffffed;backdrop-filter:blur(15px);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #39121b20;justify-content:space-around;padding:7px}.bottom-nav button{background:transparent;color:#71666d;font-size:10px;display:grid;justify-items:center;gap:2px}.bottom-nav button b{font-size:20px}.bottom-nav button.active{color:var(--red)}.page-title h2{font-size:23px}.task-item{padding:12px 5px}.top-actions .btn{padding:9px 11px}}
</style></head>
<body><div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">✎</div><h1>Crimson Notes</h1><small>Your ideas, beautifully organized</small></div>
 <div class="nav-label">WORKSPACE</div><nav class="nav" id="sideNav">
 <button data-view="home" class="active"><span class="ico">⌂</span>Home</button><button data-view="notes"><span class="ico">▤</span>All notes</button><button data-view="notebooks"><span class="ico">▣</span>Notebooks</button><button data-view="tasks"><span class="ico">☑</span>Tasks</button><button data-view="favorites"><span class="ico">☆</span>Favorites</button>
 <div class="nav-label">LIBRARY</div><button data-view="archive"><span class="ico">▱</span>Archive</button><button data-view="trash"><span class="ico">♲</span>Trash</button></nav>
 <div class="side-bottom"><div class="storage"><div class="storage-line"><b>Local workspace</b><span id="noteCount">0 notes</span></div><div class="bar"><i></i></div><small class="muted">Saved automatically on this device</small></div><button class="btn light" style="width:100%" id="backupBtn">⇩ Export backup</button></div>
</aside>
<main class="main">
<header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn">☰</button><div class="search"><span>⌕</span><input id="searchInput" placeholder="Search notes, notebooks, tags…  ( / )"></div><div class="top-actions"><button class="icon-btn hide-mobile" id="importBtn" title="Import backup">⇧</button><button class="icon-btn hide-mobile" id="themeBtn" title="Toggle theme">◐</button><div class="avatar">Y</div></div></header>
<section id="view"></section>
</main></div>
<nav class="bottom-nav"><button data-view="home" class="active"><b>⌂</b>Home</button><button data-view="notes"><b>▤</b>Notes</button><button id="mobileAdd"><b style="color:#bd1234;font-size:27px">＋</b>New</button><button data-view="tasks"><b>☑</b>Tasks</button><button data-view="notebooks"><b>▣</b>Books</button></nav>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" hidden>
<script>
const KEY='crimson-notes-v1';
const starter=()=>({notes:[{id:id(),title:'Welcome to Crimson Notes',body:'<h2>Your personal space</h2><p>Capture ideas, organize projects, and keep everything in one calm, beautiful workspace.</p><blockquote>Great ideas start with a simple note.</blockquote><ul><li>Create your first note</li><li>Organize it in a notebook</li><li>Keep important thoughts in Favorites</li></ul>',book:'Personal',tags:['welcome','guide'],favorite:true,archived:false,deleted:false,updated:Date.now()}],books:[{name:'Personal',emoji:'♡'},{name:'Projects',emoji:'▣'},{name:'Learning',emoji:'✦'},{name:'Ideas',emoji:'☼'}],tasks:[{id:id(),text:'Create your first note',date:'',done:false},{id:id(),text:'Explore your workspace',date:'',done:false}],theme:'light'});
function id(){return Math.random().toString(36).slice(2,10)}let data;try{data=JSON.parse(localStorage.getItem(KEY))||starter()}catch(e){data=starter()}
let currentView='home',activeId=null,filter='all',selectedBookFilter=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('#noteCount').textContent=data.notes.filter(n=>!n.deleted).length+' notes';}catch(e){toast('Storage is full. Export a backup and remove large attachments.')}}function $(s){return document.querySelector(s)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function note(idv){return data.notes.find(n=>n.id===idv)}function activeNotes(){return data.notes.filter(n=>!n.deleted&&!n.archived)}
function setView(v){currentView=v;activeId=null;selectedBookFilter=null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function header(title,sub,action=''){return `<div class="page-title"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function render(){save();let v=$('#view');if(currentView==='home')v.innerHTML=home();else if(currentView==='notes'||currentView==='favorites'||currentView==='archive'||currentView==='trash')v.innerHTML=notesPage();else if(currentView==='notebooks')v.innerHTML=booksPage();else if(currentView==='tasks')v.innerHTML=tasksPage();bindView()}
function home(){let ns=activeNotes().sort((a,b)=>b.updated-a.updated).slice(0,4),books=data.books;return `<section class="hero"><h2>A clearer space for your ideas.</h2><p>Write, plan, collect and connect your thoughts — all in one beautifully organized place.</p><button class="btn" id="heroNew">＋ Create a new note</button><div class="hero-art">✧</div></section>
<div class="quick"><button id="quickNote"><span>✎</span>New note</button><button id="quickTask"><span>☑</span>Add task</button><button id="quickBook"><span>▣</span>New notebook</button><button id="quickDaily"><span>☼</span>Daily note</button><button id="quickBackup"><span>⇩</span>Backup</button></div>
<div class="grid"><section class="panel"><div class="panel-head"><h3>▣ &nbsp;My notebooks</h3><button class="link-btn" data-goto="notebooks">View all →</button></div><div class="notebook-grid">${books.slice(0,4).map(b=>`<div class="notebook" data-book="${esc(b.name)}"><span class="emoji">${esc(b.emoji||'▣')}</span><div><strong>${esc(b.name)}</strong><br><small>${data.notes.filter(n=>!n.deleted&&n.book===b.name).length} notes</small></div></div>`).join('')||'<div class="empty">Create your first notebook</div>'}</div></section>
<section class="panel"><div class="panel-head"><h3>☑ &nbsp;Upcoming tasks</h3><button class="link-btn" data-goto="tasks">View all →</button></div>${data.tasks.filter(t=>!t.done).slice(0,4).map(t=>`<div class="task-row"><button class="task-check" data-task="${t.id}"></button><div class="task-main"><strong>${esc(t.text)}</strong><small>${t.date||'No due date'}</small></div><span class="pill">To do</span></div>`).join('')||'<div class="empty">All caught up. Nice work!</div>'}</section>
<section class="panel"><div class="panel-head"><h3>▤ &nbsp;Recent notes</h3><button class="link-btn" data-goto="notes">View all →</button></div>${ns.map(n=>`<div class="note-row" data-open="${n.id}"><div class="note-thumb">▤</div><div class="note-main"><strong>${esc(n.title||'Untitled')}</strong><small>${time(n.updated)} · ${esc(n.book)}</small></div><span class="muted">›</span></div>`).join('')||'<div class="empty">Your notes will appear here.</div>'}</section>
<section class="panel"><div class="panel-head"><h3>✧ &nbsp;A little space to think</h3></div><p class="muted">A good workspace should feel simple. Use notebooks to group your notes, tags to find them later, and tasks to turn ideas into action.</p><button class="btn light" id="tipNew">Start writing →</button></section></div>`}
function notesPage(){let list=data.notes.filter(n=>{if(currentView==='favorites')return n.favorite&&!n.deleted&&!n.archived;if(currentView==='archive')return n.archived&&!n.deleted;if(currentView==='trash')return n.deleted;return !n.deleted&&!n.archived});if(selectedBookFilter)list=list.filter(n=>n.book===selectedBookFilter);let q=$('#searchInput').value.toLowerCase();if(q)list=list.filter(n=>(n.title+' '+n.body+' '+n.tags.join(' ')+' '+n.book).toLowerCase().includes(q));list.sort((a,b)=>b.updated-a.updated);let selected=activeId&&list.some(n=>n.id===activeId)?activeId:(list[0]?.id||null);activeId=selected;
return `${header(currentView==='favorites'?'Favorites':currentView==='archive'?'Archive':currentView==='trash'?'Trash':'All notes',`${list.length} ${list.length===1?'note':'notes'}`,currentView==='trash'?'':`<button class="btn" id="newNote">＋ New note</button>`)}
<div class="notes-layout"><section class="panel list-panel"><div class="filterbar"><button class="active" data-filter="all">Recent</button><button data-filter="title">A–Z</button></div><div id="noteList">${list.map(n=>`<div class="note-card ${n.id===selected?'active':''}" data-select="${n.id}"><strong>${esc(n.title||'Untitled')}</strong><small>${time(n.updated)} · ${esc(n.book)}${n.favorite?' · ★':''}</small><small>${esc(n.tags.map(t=>'#'+t).join(' '))}</small></div>`).join('')||'<div class="empty">Nothing here yet.</div>'}</div></section>${selected?editor(note(selected)):currentView==='trash'?'<section class="panel empty">Deleted notes appear here for recovery or permanent deletion.</section>':'<section class="panel empty">Create a note to get started.</section>'}</div>`}
function editor(n){if(!n)return '';return `<section class="panel editor"><div class="editor-top"><input class="editor-title" id="editTitle" value="${esc(n.title)}" placeholder="Untitled note"><div style="display:flex;gap:5px"><button class="icon-btn" id="favoriteBtn" title="Favorite">${n.favorite?'★':'☆'}</button><button class="icon-btn" id="moreNote" title="More actions">•••</button></div></div><div class="editor-meta"><span>In</span><select id="editBook" style="border:0;background:#faf7f8;padding:6px;border-radius:8px">${data.books.map(b=>`<option ${n.book===b.name?'selected':''}>${esc(b.name)}</option>`).join('')}</select><span>Tags</span><input id="editTags" value="${esc(n.tags.join(', '))}" placeholder="ideas, work, study"></div><div class="toolbar">
<button class="tool" data-cmd="bold"><b>B</b></button><button class="tool" data-cmd="italic"><i>I</i></button><button class="tool" data-cmd="underline"><u>U</u></button><button class="tool" data-block="H1">H1</button><button class="tool" data-block="H2">H2</button><button class="tool" data-cmd="insertUnorderedList">☷</button><button class="tool" data-cmd="insertOrderedList">1.</button><button class="tool" id="checklistTool">☑</button><button class="tool" id="quoteTool">❞</button><button class="tool" id="linkTool">↗</button><button class="tool" id="imageTool">▧</button><button class="tool" id="tableTool">▦</button><button class="tool" data-cmd="undo">↶</button><button class="tool" data-cmd="redo">↷</button></div>
<div id="editBody" class="content" contenteditable="true" spellcheck="true">${n.body||''}</div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:20px;color:var(--muted);font-size:11px"><span id="wordCount">0 words</span><span>✓ Saved automatically</span></div></section>`}
function booksPage(){return `${header('Your notebooks','Organize notes into focused spaces.',`<button class="btn" id="newBook">＋ New notebook</button>`)}<div class="notebook-grid" style="grid-template-columns:repeat(auto-fill,minmax(175px,1fr))">${data.books.map(b=>`<div class="notebook" data-book="${esc(b.name)}" style="min-height:155px"><span class="emoji">${esc(b.emoji||'▣')}</span><div><strong>${esc(b.name)}</strong><br><small>${data.notes.filter(n=>!n.deleted&&n.book===b.name).length} notes</small></div><button class="btn small light" data-book-open="${esc(b.name)}">Open notebook</button></div>`).join('')}</div>`}
function tasksPage(){return `${header('Tasks & to-dos','Turn your notes into meaningful next steps.',`<button class="btn" id="newTask">＋ Add task</button>`)}<section class="panel task-page">${data.tasks.length?data.tasks.map(t=>`<div class="task-item"><button class="task-check ${t.done?'done':''}" data-task="${t.id}">${t.done?'✓':''}</button><div class="task-main"><strong style="${t.done?'text-decoration:line-through;color:#aaa':''}">${esc(t.text)}</strong><small>${t.date||'No due date'}</small></div><button class="icon-btn" data-task-delete="${t.id}">×</button></div>`).join(''):'<div class="empty">No tasks yet. Add one when you are ready.</div>'}</section>`}
function time(ts){let d=new Date(ts);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function openModal(title,fields,submit){$('#modal').innerHTML=`<h3>${title}</h3>${fields}<div class="modal-actions"><button class="btn ghost" id="cancelModal">Cancel</button><button class="btn" id="submitModal">Create</button></div>`;$('#modalBack').classList.add('show');$('#cancelModal').onclick=closeModal;$('#submitModal').onclick=()=>{if(submit()!==false)closeModal()};}
function closeModal(){$('#modalBack').classList.remove('show')}
function newNote(book='Personal',body=''){let n={id:id(),title:'',body,book:data.books.some(b=>b.name===book)?book:data.books[0]?.name||'Personal',tags:[],favorite:false,archived:false,deleted:false,updated:Date.now()};data.notes.push(n);activeId=n.id;currentView='notes';render();$('#editTitle')?.focus();toast('New note created')}
function newTask(){openModal('Add a task',`<div class="field"><label>Task</label><input id="taskText" placeholder="What needs to get done?"></div><div class="field"><label>Due date (optional)</label><input type="date" id="taskDate"></div>`,()=>{let text=$('#taskText').value.trim();if(!text)return false;data.tasks.unshift({id:id(),text,date:$('#taskDate').value,done:false});render();toast('Task added')})}
function newBook(){openModal('Create a notebook',`<div class="field"><label>Notebook name</label><input id="bookName" placeholder="e.g. Work, Research, Journal"></div><div class="field"><label>Icon</label><input id="bookEmoji" maxlength="4" value="▣"></div>`,()=>{let name=$('#bookName').value.trim();if(!name)return false;if(data.books.some(b=>b.name.toLowerCase()===name.toLowerCase())){toast('Notebook already exists');return false}data.books.push({name,emoji:$('#bookEmoji').value||'▣'});render();toast('Notebook created')})}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='crimson-notes-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function bindView(){
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setView(b.dataset.goto));
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{activeId=b.dataset.open;setView('notes');activeId=b.dataset.open;render()});
document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{selectedBookFilter=b.dataset.book;currentView='notes';activeId=null;render()});
document.querySelectorAll('[data-book-open]').forEach(b=>b.onclick=()=>{selectedBookFilter=b.dataset.book;currentView='notes';activeId=null;render()});
document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let t=data.tasks.find(t=>t.id===b.dataset.task);if(t)t.done=!t.done;render()});
$('#heroNew')?.addEventListener('click',()=>newNote());$('#quickNote')?.addEventListener('click',()=>newNote());$('#tipNew')?.addEventListener('click',()=>newNote());$('#quickTask')?.addEventListener('click',newTask);$('#quickBook')?.addEventListener('click',newBook);$('#quickDaily')?.addEventListener('click',()=>{let d=new Date().toLocaleDateString();let n=data.notes.find(n=>n.title==='Daily note — '+d&&!n.deleted);n?(activeId=n.id,setView('notes')):newNote('Personal','<h2>Today</h2><p></p>')});$('#quickBackup')?.addEventListener('click',backup);
$('#newNote')?.addEventListener('click',()=>newNote());$('#newBook')?.addEventListener('click',newBook);$('#newTask')?.addEventListener('click',newTask);
document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{activeId=b.dataset.select;render()});
$('#editTitle')?.addEventListener('input',e=>updateNote({title:e.target.value}));
$('#editBook')?.addEventListener('change',e=>updateNote({book:e.target.value}));
$('#editTags')?.addEventListener('change',e=>updateNote({tags:e.target.value.split(',').map(x=>x.trim()).filter(Boolean)}));
$('#editBody')?.addEventListener('input',e=>{updateNote({body:e.target.innerHTML});let words=e.target.innerText.trim().split(/\s+/).filter(Boolean).length;$('#wordCount').textContent=words+' words'});
$('#wordCount')&&($('#wordCount').textContent=($('#editBody')?.innerText.trim().split(/\s+/).filter(Boolean).length||0)+' words');
$('#favoriteBtn')?.addEventListener('click',()=>{let n=note(activeId);n.favorite=!n.favorite;render()});
$('#moreNote')?.addEventListener('click',()=>{let n=note(activeId);let restore=currentView==='archive'||currentView==='trash';let permanent=currentView==='trash';openModal('Note options',`<p class="muted">Choose what to do with “${esc(n.title||'Untitled')}”.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn light" id="archiveAction">${restore?'Restore note':'Archive note'}</button><button class="btn light" id="deleteAction">${permanent?'Delete permanently':'Move to trash'}</button></div>`,()=>false);$('#archiveAction').onclick=()=>{n.archived=false;n.deleted=false;closeModal();render();toast('Note restored')};$('#deleteAction').onclick=()=>{if(permanent){if(!confirm('Permanently delete this note?'))return;data.notes=data.notes.filter(x=>x.id!==n.id)}else{n.deleted=true}closeModal();activeId=null;render();toast(permanent?'Note permanently deleted':'Moved to trash')};});
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,null);$('#editBody')?.focus()});
document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{document.execCommand('formatBlock',false,b.dataset.block);$('#editBody')?.focus()});
$('#checklistTool')?.addEventListener('click',()=>{document.execCommand('insertHTML',false,'<label><input type="checkbox"> New checklist item</label><br>');$('#editBody').focus()});
$('#quoteTool')?.addEventListener('click',()=>{document.execCommand('formatBlock',false,'BLOCKQUOTE');$('#editBody').focus()});
$('#linkTool')?.addEventListener('click',()=>{let u=prompt('Enter a URL');if(u)document.execCommand('createLink',false,u)});
$('#imageTool')?.addEventListener('click',()=>{let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.execCommand('insertImage',false,r.result);updateNote({body:$('#editBody').innerHTML})};r.readAsDataURL(f)};inp.click()});
$('#tableTool')?.addEventListener('click',()=>{document.execCommand('insertHTML',false,'<table border="1"><tr><th>Column 1</th><th>Column 2</th></tr><tr><td> </td><td> </td></tr></table><p></p>')});
document.querySelectorAll('[data-task-delete]').forEach(b=>b.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==b.dataset.taskDelete);render()});
}
function updateNote(p){let n=note(activeId);if(n){Object.assign(n,p,{updated:Date.now()});save()}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#searchInput').addEventListener('input',()=>{if(currentView==='home'&&$('#searchInput').value)setView('notes');else if(['notes','favorites','archive','trash'].includes(currentView))render()});
$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';render()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchInput').focus()}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();toast('All changes saved')}});
$('#backupBtn').onclick=backup;$('#quickBackup')?.addEventListener('click',backup);$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.notes||!x.books||!x.tasks)throw 0;if(confirm('Replace this browser workspace with the imported backup?')){data=x;save();render();toast('Backup restored')}}catch(_){toast('This backup file is not valid')} };r.readAsText(f)};
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');toast(document.body.classList.contains('dark')?'Dark preview enabled':'Light theme enabled')};
$('#mobileAdd').onclick=()=>newNote();
$('#menuBtn').onclick=()=>toast('Use the bottom navigation to move around');
render();
</script></body></html>
