plugins { id 'com.android.application' }
android {
  namespace 'app.vercel.crimsonnote.twa'
  compileSdk 34
  defaultConfig {
    applicationId 'app.vercel.crimsonnote'
    minSdk 23
    targetSdk 34
    versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    versionName '1.0'
  }
  signingConfigs {
    release {
      storeFile file('../spark.p12'); storePassword 'sparkapp'
      keyAlias 'spark'; keyPassword 'sparkapp'; storeType 'pkcs12'
    }
  }
  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
  implementation 'androidx.appcompat:appcompat:1.6.1'
}
