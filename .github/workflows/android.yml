name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['twa/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build release APK
        working-directory: twa
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp twa/app/build/outputs/apk/release/app-release.apk Spark.apk
      - uses: actions/upload-artifact@v4
        with: { name: Spark-apk, path: Spark.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Spark APK ${{ github.run_number }}
          files: Spark.apk
