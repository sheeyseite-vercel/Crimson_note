<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Spark — مساحتك الخاصة للكتابة والتنظيم">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spark">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>window.__deploy=1</script>
</head>
<body>
<title>Spark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: glass sidebar + scrolling main column; crimson on white smoke, dark wine variant */
:root{
  --bg:#f5f5f5; --bg-tint:#fbf2e2; --surface:rgba(255,255,255,.76); --solid:#ffffff; --solid-2:#fdf6ea; --line:rgba(120,70,0,.12);
  --fg:#2a1d0c; --fg2:#6b5636; --fg3:#8f7a55;
  --ac:#fd7903; --ac2:#fee800; --ac-text:#bd5200; --ac-soft:rgba(253,121,3,.10); --ac-soft2:rgba(253,121,3,.19); --on-ac:#2a1500;
  --ok:#1b9a5f; --warn:#d97a06; --info:#6d4be0;
  --sh:0 14px 34px -16px rgba(170,90,0,.34); --sh-sm:0 4px 14px -6px rgba(170,90,0,.24);
  --blob1:rgba(253,121,3,.20); --blob2:rgba(254,226,0,.30); --paper:#ffffff; --scrim:rgba(40,20,0,.45);
  --f:'Outfit','Cairo',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --bg-tint:#0f0f0f; --surface:rgba(20,20,20,.78); --solid:#141414; --solid-2:#1e1e1e; --line:rgba(255,255,255,.10);
  --fg:#f2f2f2; --fg2:#b5b5b5; --fg3:#858585;
  --ac:#fd7903; --ac2:#fee800; --ac-text:#ffa238; --ac-soft:rgba(255,150,40,.13); --ac-soft2:rgba(255,150,40,.24); --on-ac:#2a1500;
  --ok:#3cc98a; --warn:#f0a030; --info:#9b85ff;
  --sh:0 14px 34px -16px rgba(0,0,0,.75); --sh-sm:0 4px 14px -6px rgba(0,0,0,.6);
  --blob1:rgba(0,0,0,0); --blob2:rgba(0,0,0,0); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --bg-tint:#0f0f0f; --surface:rgba(20,20,20,.78); --solid:#141414; --solid-2:#1e1e1e; --line:rgba(255,255,255,.10);
  --fg:#f2f2f2; --fg2:#b5b5b5; --fg3:#858585;
  --ac:#fd7903; --ac2:#fee800; --ac-text:#ffa238; --ac-soft:rgba(255,150,40,.13); --ac-soft2:rgba(255,150,40,.24); --on-ac:#2a1500;
  --ok:#3cc98a; --warn:#f0a030; --info:#9b85ff;
  --sh:0 14px 34px -16px rgba(0,0,0,.75); --sh-sm:0 4px 14px -6px rgba(0,0,0,.6);
  --blob1:rgba(0,0,0,0); --blob2:rgba(0,0,0,0); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:10px}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(700px 420px at 85% -5%,var(--blob2),transparent 70%),
  radial-gradient(620px 520px at -5% 105%,var(--blob1),transparent 70%),
  linear-gradient(180deg,var(--bg),var(--bg-tint))}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}

.app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}

/* sidebar */
.side{display:flex;flex-direction:column;gap:6px;padding:18px 12px 14px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:auto;min-height:0}
.wm{display:flex;flex-direction:column;align-items:center;padding:6px 0 16px}
.wm b{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.wm b i{font-style:normal;color:var(--ac-text)}
.wm small{color:var(--fg3);font-size:12px;letter-spacing:.4px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;color:var(--fg);font-weight:500;width:100%;text-align:start;transition:background .15s}
.nav:hover{background:var(--ac-soft)}
.nav .ic{color:var(--fg2)}
.nav.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on-ac);box-shadow:var(--sh-sm);font-weight:600}
.nav.on .ic{color:var(--on-ac)}
.nav .bd{margin-inline-start:auto;background:var(--ac);color:var(--on-ac);border-radius:999px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;font-weight:600}
.nav.on .bd{background:var(--on-ac);color:var(--ac2)}
.sp{flex:1}
.stor{padding:12px 14px;border-radius:18px;background:var(--solid);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:13px}
.stor .tr{display:flex;align-items:center;gap:8px;font-weight:500}
.stor .tr .ic{color:var(--ac-text)}
.bar{height:7px;border-radius:9px;background:var(--ac-soft2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--fg2);padding:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.bad::before{background:var(--warn)}
.theme{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--solid);border:1px solid var(--line)}
.theme button{display:grid;place-items:center;height:34px;border-radius:999px;color:var(--fg3)}
.theme button.on{background:var(--ac-soft2);color:var(--ac-text)}

/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top>*{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding-bottom:14px}
.searchbar{min-width:0;flex:1;max-width:520px;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg3);text-align:start;box-shadow:var(--sh-sm)}
.searchbar span{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.searchbar kbd{font:500 12px var(--f);padding:2px 8px;border-radius:8px;background:var(--ac-soft);color:var(--fg2)}
.tsp{flex:1}
.ib{flex:none;position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);color:var(--fg)}
.ib .bd{position:absolute;top:-3px;inset-inline-end:-3px;background:var(--ac);color:var(--on-ac);border-radius:999px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;font-weight:600}
.pill{flex:none;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);font-weight:600;font-size:14px}
.menu-btn{display:none}
.av{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:700;font-size:18px;border:2px solid var(--solid);box-shadow:var(--sh-sm)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:88px;height:88px;font-size:34px}
.av .ic{width:22px;height:22px}.av.lg .ic{width:40px;height:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on-ac);font-weight:600;font-size:14px;box-shadow:var(--sh-sm);white-space:nowrap}
.btn.ghost{background:var(--ac-soft);color:var(--ac-text);box-shadow:none}
.btn.danger{background:none;color:var(--ac-text);box-shadow:none;border:1px solid var(--ac-soft2)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.view{flex:1;min-height:0;overflow:auto;padding:2px 2px 28px;scrollbar-width:thin}
.h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.25}
.sub{color:var(--fg2);margin:2px 0 0}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh .sp{flex:1}
.sec{padding:18px 20px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:18px;font-weight:700}
.sec-h .ic{color:var(--ac-text)}
.sec-h a,.link{margin-inline-start:auto;color:var(--ac-text);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--ac-soft);color:var(--ac-text);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.n{background:var(--solid-2);color:var(--fg2)}
.chip.ok{background:rgba(27,154,95,.14);color:var(--ok)}
.chip.warn{background:rgba(217,122,6,.15);color:var(--warn)}
.chip.red{background:var(--ac);color:var(--on-ac)}
.in{width:100%;height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--solid);outline-offset:1px}
select.in{padding-inline-end:8px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;color:var(--on-ac);padding:30px 32px;min-height:196px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:linear-gradient(115deg,var(--ac) 0%,color-mix(in srgb,var(--ac),var(--ac2)) 52%,var(--ac2) 100%);box-shadow:var(--sh)}
.hero h1{margin:0;font-size:34px;font-weight:700;line-height:1.2;letter-spacing:-.4px;position:relative}
.hero p{margin:0;opacity:.92;position:relative;max-width:46ch}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.hero .chip{background:rgba(0,0,0,.10);color:var(--on-ac);backdrop-filter:blur(6px)}
.hero .btn{background:var(--on-ac);color:#fff;align-self:flex-start;position:relative;margin-top:4px}
.mtn{position:absolute;inset-block:0 0;inset-inline-end:0;height:100%;width:62%;pointer-events:none}
[dir=rtl] .mtn{transform:scaleX(-1)}

.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);font-size:13.5px;font-weight:500;transition:transform .15s}
.qa button:hover{transform:translateY(-2px)}
.qa .ic{width:26px;height:26px;color:var(--ac-text)}

/* notebooks */
.nbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.nbk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;padding:16px 10px;border-radius:20px;color:#fff;text-align:center;box-shadow:var(--sh-sm);transition:transform .15s;font-weight:600}
.nbk:hover{transform:translateY(-3px)}
.nbk .ic{width:34px;height:34px;margin-bottom:6px}
.nbk small{font-weight:400;opacity:.9;font-size:13px}
.nbk.add{background:var(--ac-soft);border:1.5px dashed var(--ac-soft2);color:var(--ac-text);box-shadow:none}
.nbk .mo{position:absolute;inset-block-end:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);color:#7a0a22;display:grid;place-items:center}
.nbk .mo .ic{width:18px;height:18px;margin:0}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-align:start;width:100%}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--fg3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th{width:48px;height:48px;border-radius:12px;background:var(--ac-soft);display:grid;place-items:center;font-size:24px;flex:none;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;flex:none;color:transparent}
.chk .ic{width:15px;height:15px;stroke-width:3}
.chk.on{background:var(--ac);color:var(--on-ac)}
.t-done .tx b{text-decoration:line-through;color:var(--fg3)}
.empty{padding:26px 10px;text-align:center;color:var(--fg3)}
.empty b{display:block;color:var(--fg2);margin-bottom:4px}
.week{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.stack>*,.cols>*{min-width:0}
.week div{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--fg3)}
.week span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week i{display:block;width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:var(--ac-soft2);min-height:6px}
.week .tdy i{background:linear-gradient(180deg,var(--ac),var(--ac2))}
.week em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--fg2);font-weight:600}
.big{display:flex;gap:18px;margin-top:6px}
.big div{flex:1;padding:12px 14px;border-radius:16px;background:var(--solid);border:1px solid var(--line)}
.big b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.big span{color:var(--fg2);font-size:13px}

/* notes list */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools .in{width:auto;flex:1;min-width:160px;max-width:340px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--solid);border:1px solid var(--line)}
.seg button{width:38px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--fg3)}
.seg .on{background:var(--ac-soft2);color:var(--ac-text)}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchips button{padding:6px 14px;border-radius:999px;background:var(--solid);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--fg2)}
.fchips .on{background:var(--ac);color:var(--on-ac);border-color:transparent}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ngrid.list{grid-template-columns:1fr}
.nc{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);text-align:start;transition:transform .15s;min-width:0}
.nc:hover{transform:translateY(-2px)}
.nc .hd{display:flex;align-items:center;gap:10px}
.nc .ni{font-size:26px;line-height:1}
.nc h3{margin:0;font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nc p{margin:0;color:var(--fg2);font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.1em}
.nc .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--fg3);font-size:12.5px}
.nc .st{color:var(--warn)}
.ngrid.list .nc{flex-direction:row;align-items:center}
.ngrid.list .nc p{display:none}
.ngrid.list .nc .hd{flex:1}
.mo2{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);flex:none}
.mo2:hover{background:var(--ac-soft)}

/* tasks */
.tadd{display:grid;grid-template-columns:minmax(0,1fr) 140px 110px 140px 120px 140px auto;gap:10px;padding:14px;margin-bottom:14px}
.prio{width:10px;height:10px;border-radius:50%;flex:none}
.p1{background:var(--ok)}.p2{background:var(--warn)}.p3{background:var(--ac)}

/* calendar */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-w{text-align:center;color:var(--fg3);font-size:13px;font-weight:600;padding:6px 0}
.cd{min-height:84px;padding:8px;border-radius:16px;background:var(--solid);border:1px solid var(--line);text-align:start;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cd b{font-weight:600;font-variant-numeric:tabular-nums}
.cd.o{opacity:.45}
.cd.today b{background:var(--ac);color:var(--on-ac);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.cd.sel{outline:2px solid var(--ac);outline-offset:-1px}
.cd .dots{display:flex;gap:4px;flex-wrap:wrap}
.cd .dots i{width:7px;height:7px;border-radius:50%;background:var(--ac)}
.cd .dots i.nn{background:var(--info)}
.cd small{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--ac-soft);border-radius:6px;padding:0 6px}

/* templates */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tp{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);text-align:start;transition:transform .15s}
.tp:hover{transform:translateY(-3px)}
.tp .e{font-size:32px;line-height:1}
.tp b{font-size:16px}
.tp span{color:var(--fg2);font-size:13.5px}

/* graph */
.gwrap{position:relative;height:min(68vh,640px);min-height:340px;overflow:hidden}
.gwrap canvas{display:block}
.gtip{position:absolute;pointer-events:none;padding:4px 10px;border-radius:10px;background:var(--solid);border:1px solid var(--line);font-size:13px;box-shadow:var(--sh-sm);display:none}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.ed-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--fg2);font-size:14px;min-width:0;flex:1}
.crumbs button{color:var(--fg2);display:inline-flex;align-items:center;gap:6px}
.crumbs b{color:var(--fg);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:26ch}
.saved{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--solid);border:1px solid var(--line);font-size:13px;color:var(--fg2)}
.saved .ic{width:16px;height:16px;color:var(--ok)}
.page{padding:0 0 18px;overflow:hidden}
.cover{height:120px;background:linear-gradient(120deg,var(--ac),var(--ac2))}
.pg{padding:22px 26px 0}
.tl{display:flex;align-items:center;gap:14px}
.nic{width:62px;height:62px;border-radius:18px;background:var(--ac-soft);font-size:34px;display:grid;place-items:center;flex:none}
.nt{flex:1;min-width:0;border:0;background:none;outline:none;font-size:34px;font-weight:700;letter-spacing:-.4px;line-height:1.2;padding:4px 0}
.nt::placeholder{color:var(--fg3)}
.props{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 14px;color:var(--fg2);font-size:13.5px}

/* ---------- content builder (templates & seeds) ---------- */
function B(a){return a.map(s=>{const i=s.indexOf(':');const k=i<0?s:s.slice(0,i),v=i<0?'':s.slice(i+1);const P=v.split('|').map(esc);
 switch(k){
  case'h1':case'h2':case'h3':return `<${k}>${esc(v)}</${k}>`;
  case'p':return `<p>${esc(v)}</p>`;
  case'ul':return '<ul>'+P.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  case'ol':return '<ol>'+P.map(x=>`<li>${x}</li>`).join('')+'</ol>';
  case'todo':return '<ul class="todo">'+P.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  case'done':return '<ul class="todo">'+P.map(x=>`<li data-done="1">${x}</li>`).join('')+'</ul>';
  case'q':return `<blockquote>${esc(v)}</blockquote>`;
  case'call':return `<div class="callout">${esc(v)}</div>`;
  case'hr':return '<hr>';
  case'tbl':{const rows=v.split(';').map(r=>r.split(',').map(esc));return '<table><tbody>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')+'</tr>').join('')+'</tbody></table>'}
  default:return '';
 }}).join('')+'<p><br></p>'}

/* ---------- state & storage ---------- */
let S=null,storeOK=true,saveT=null,lastSaved=0;
const memUI={nb:null,tag:null,sort:'updated',mode:'grid',q:'',tf:'all',cal:null,sel:null,sideTab:'outline',kind:'notes'};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('crimson-notes',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function loadState(){
 try{const db=await idb();const v=await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});db.close();if(v)return JSON.parse(v)}catch(e){}
 try{const s=localStorage.getItem('crimson-notes-state');if(s)return JSON.parse(s)}catch(e){}
 return null}
async function persist(){
 const data=JSON.stringify(S);let ok=false;
 try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(data,'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();ok=true}catch(e){}
 if(!ok){try{localStorage.setItem('crimson-notes-state',data);ok=true}catch(e){}}
 storeOK=ok;lastSaved=Date.now();updStorage(data.length);try{window.__pushSync&&window.__pushSync();window.__cloudSync&&window.__cloudSync()}catch(e){}return ok}
function save(now){clearTimeout(saveT);if(now){return persist()}saveT=setTimeout(()=>{persist().then(()=>{const s=$('#stat');if(s&&!pendingEd)setStatus('saved')})},250)}
let usage=0,quota=0;
async function updStorage(len){usage=len||usage;try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();quota=e.quota||0}}catch(e){}const el=$('#stor');if(el)el.innerHTML=storHtml();const sy=$('#sync');if(sy){sy.className='sync'+(storeOK?'':' bad');sy.textContent=storeOK?t('savedDev'):t('noStore')}}
function fmtBytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function storHtml(){const pct=quota?Math.max(3,Math.min(100,usage/quota*100)):Math.max(3,Math.min(100,usage/5242880*100));return `<div class="tr">${ic('folder')}<span>${t('storage')}</span></div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><span style="color:var(--fg2)">${fmtBytes(usage)} ${t('usedOf')}</span>`}

const note=id=>S.notes.find(n=>n.id===id);
const nbOf=id=>S.notebooks.find(n=>n.id===id);
const live=()=>S.notes.filter(n=>!n.trashed&&!n.archived);
const plain=html=>{const d=document.createElement('div');d.innerHTML=html||'';return (d.innerText||d.textContent||'').replace(/\s+/g,' ').trim()};
const dloc=()=>lang==='ar'?'ar-DZ':'en-GB';
function rel(ts){const d=(ts-Date.now())/1000,a=Math.abs(d);const f=new Intl.RelativeTimeFormat(dloc(),{numeric:'auto'});
 if(a<60)return f.format(Math.round(d/60)||0,'minute');if(a<3600)return f.format(Math.round(d/60),'minute');if(a<86400)return f.format(Math.round(d/3600),'hour');if(a<86400*30)return f.format(Math.round(d/86400),'day');return new Date(ts).toLocaleDateString(dloc(),{day:'numeric',month:'short',year:'numeric'})}
const fdate=(k,o)=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(dloc(),o||{day:'numeric',month:'short'})};
function dueLabel(k){if(!k)return t('noDate');const td=dkey(),tm=dkey(Date.now()+DAY);if(k===td)return t('today');if(k===tm)return t('tomorrow');return fdate(k)}
function streak(){let n=0,d=Date.now();if(!S.act[dkey(d)])d-=DAY;while(S.act[dkey(d)]){n++;d-=DAY}return n}
function bump(){const k=dkey();S.act[k]=(S.act[k]||0)+1}

/* sanitize imported html */
function sanitize(html){const d=new DOMParser().parseFromString('<body>'+html,'text/html');
 d.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base,svg,math').forEach(e=>e.remove());
 d.body.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();
  if(n.startsWith('on')||((n==='href'||n==='src'||n==='xlink:href')&&(v.startsWith('javascript:')||(v.startsWith('data:')&&!v.startsWith('data:image/png')&&!v.startsWith('data:image/jpeg')&&!v.startsWith('data:image/webp')&&!v.startsWith('data:image/gif')))))e.removeAttribute(a.name)});
  if(e.tagName==='A'&&e.getAttribute('href')&&!e.dataset.note)e.setAttribute('rel','noopener noreferrer')});
 return d.body.innerHTML}

/* ---------- overlays ---------- */
function openModal(html,cls=''){const ov=document.createElement('div');ov.className='ov '+(cls.includes('pal')?'':'');ov.innerHTML=`<div class="dlg ${cls}" role="dialog" aria-modal="true">${html}</div>`;
 ov.addEventListener('mousedown',e=>{if(e.target===ov)(ov._cancel||(()=>ov.remove()))()});$('#layer').append(ov);return ov}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),2400)}
function ask({title,value='',ph='',ok=t('ok')}){return new Promise(res=>{const ov=openModal(`<h3>${esc(title)}</h3><input class="in" id="aq" value="${esc(value)}" placeholder="${esc(ph)}"><div class="dlg-a"><button class="btn ghost" data-x type="button">${t('cancel')}</button><button class="btn" data-ok type="button">${esc(ok)}</button></div>`);
 const i=$('#aq',ov);i.focus();i.select();const done=v=>{ov.remove();res(v)};ov._cancel=()=>done(null);
 $('[data-x]',ov).onclick=()=>done(null);$('[data-ok]',ov).onclick=()=>done(i.value.trim());i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim())}})}
function sure(msg,ok=t('del')){return new Promise(res=>{const ov=openModal(`<h3>${esc(msg)}</h3><div class="dlg-a"><button class="btn ghost" data-x type="button">${t('cancel')}</button><button class="btn" data-ok type="button">${esc(ok)}</button></div>`);
 const done=v=>{ov.remove();res(v)};ov._cancel=()=>done(false);$('[data-x]',ov).onclick=()=>done(false);$('[data-ok]',ov).onclick=()=>done(true);$('[data-ok]',ov).focus()})}
let curMenu=null;
function closeMenu(){if(curMenu){curMenu.remove();curMenu=null}}
function popup(anchor,html,cls=''){closeMenu();const m=document.createElement('div');m.className='pop '+cls;m.innerHTML=html;document.body.append(m);curMenu=m;
 const r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():anchor;const w=m.offsetWidth,h=m.offsetHeight;
 let x=lang==='ar'?r.right-w:r.left;x=Math.max(8,Math.min(x,innerWidth-w-8));let y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);
 m.style.left=x+'px';m.style.top=y+'px';return m}
function menu(anchor,items){const m=popup(anchor,items.map((it,i)=>it==='-'?'<hr>':`<button type="button" data-i="${i}" class="${it.dg?'dg':''}">${it.ic?ic(it.ic):''}<span>${esc(it.l)}</span></button>`).join(''));
 m.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const it=items[+b.dataset.i];closeMenu();it.run()})}

/* ---------- markdown / export / import helpers ---------- */
function mdNode(n){
 if(n.nodeType===3)return n.textContent.replace(/\s+/g,' ');
 if(n.nodeType!==1)return '';
 const tag=n.tagName.toLowerCase(),kids=()=>[...n.childNodes].map(mdNode).join('');
 switch(tag){
  case'h1':return '\n# '+kids().trim()+'\n\n';case'h2':return '\n## '+kids().trim()+'\n\n';case'h3':return '\n### '+kids().trim()+'\n\n';
  case'p':case'div':{const k=kids().trim();if(!k)return '';return n.classList.contains('callout')?'\n> '+k+'\n\n':'\n'+k+'\n'}
  case'br':return '\n';
  case'strong':case'b':return '**'+kids()+'**';
  case'em':case'i':return '*'+kids()+'*';
  case's':case'strike':return '~~'+kids()+'~~';
  case'a':return `[${kids()}](${n.getAttribute('href')||''})`;
  case'img':{const s=n.getAttribute('src')||'';return '![image]('+(s.startsWith('data:')?'embedded-image':s)+')'}
  case'ul':case'ol':{let i=0;const td=n.classList.contains('todo');return '\n'+[...n.children].map(li=>{i++;const pre=tag==='ol'?i+'. ':td?(li.dataset.done?'- [x] ':'- [ ] '):'- ';return pre+mdNode(li).trim()}).join('\n')+'\n\n'}
  case'blockquote':return '\n> '+kids().trim().replace(/\n/g,'\n> ')+'\n\n';
  case'pre':return '\n```\n'+n.textContent.replace(/\n$/,'')+'\n```\n\n';
  case'hr':return '\n---\n\n';
  case'table':{const rows=[...n.querySelectorAll('tr')].map(r=>[...r.children].map(c=>mdNode(c).trim().replace(/\|/g,'/')));if(!rows.length)return '';const w=Math.max(...rows.map(r=>r.length));const line=r=>'| '+Array.from({length:w},(_,i)=>r[i]||'').join(' | ')+' |';return '\n'+line(rows[0])+'\n|'+' --- |'.repeat(w)+'\n'+rows.slice(1).map(line).join('\n')+'\n\n'}
  default:return kids();
 }}
function noteMd(n){const d=document.createElement('div');d.innerHTML=n.html;return '# '+(n.title||t('untitled'))+'\n\n'+mdNode(d).replace(/\n{3,}/g,'\n\n').trim()+'\n'}
function noteHtml(n){return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(n.title)}</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:6px 10px}.callout{background:#fde8ec;padding:12px 16px;border-radius:12px}</style></head><body><h1>${esc(n.title)}</h1>${n.html}</body></html>`}
function mdToHtml(src){
 const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/~~([^~]+)~~/g,'<s>$1</s>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2">$1</a>');
 const lines=src.replace(/\r/g,'').split('\n');let out='',list=null,code=false,buf=[];
 const close=()=>{if(list){out+=list==='ol'?'</ol>':'</ul>';list=null}};
 for(const Ln of lines){
  if(Ln.startsWith('```')){if(code){out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';buf=[];code=false}else{close();code=true}continue}
  if(code){buf.push(Ln);continue}
  let m;
  if((m=/^(#{1,3})\s+(.*)/.exec(Ln))){close();out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if((m=/^\s*[-*]\s+\[( |x)\]\s+(.*)/i.exec(Ln))){if(list!=='todo'){close();out+='<ul class="todo">';list='todo'}out+=`<li${m[1]!==' '?' data-done="1"':''}>${inl(m[2])}</li>`}
  else if((m=/^\s*[-*]\s+(.*)/.exec(Ln))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`}
  else if((m=/^\s*\d+[.)]\s+(.*)/.exec(Ln))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`}
  else if((m=/^>\s?(.*)/.exec(Ln))){close();out+=`<blockquote>${inl(m[1])}</blockquote>`}
  else if(/^-{3,}\s*$/.test(Ln)){close();out+='<hr>'}
  else if(Ln.trim()===''){close()}
  else{close();out+=`<p>${inl(Ln)}</p>`}
 }
 close();if(code)out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';return out+'<p><br></p>'}
function readImg(file,max=1400){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const x=c.getContext('2d');const png=file.type==='image/png'&&file.size<250000;if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(png?'image/png':'image/jpeg',.86))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

let dl=null;
function exportFile(filename,text){
 const fallback=()=>{toast(t('noDl'));const ov=openModal(`<h3>${esc(filename)}</h3><textarea class="in" style="height:260px;padding:10px;font:13px var(--mono)" readonly>${esc(text)}</textarea><div class="dlg-a"><button class="btn" data-x type="button">${t('close')}</button></div>`);$('[data-x]',ov).onclick=()=>ov.remove();$('textarea',ov).select()};
 if(!dl){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:filename.endsWith('.ics')?'text/calendar;charset=utf-8':'text/plain;charset=utf-8'}));a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(t('exported'));return}catch(e){return fallback()}}

function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s*100,l*100]}

function applyAccent(){const r=document.documentElement,k=['--surface','--ac','--ac2','--ac-text','--ac-soft','--ac-soft2','--on-ac','--blob1','--blob2','--bg','--bg-tint','--solid','--solid-2','--line','--fg','--fg2','--fg3','--sh','--sh-sm'];
 const a=ACC[S.accent||0]||ACC[0];const tc=document.querySelector('meta[name=theme-color]');
 if(!S.accent){k.forEach(x=>r.style.removeProperty(x));return}
 const c1=hex2rgb(a[3]),c2=hex2rgb(a[4]),[h,s]=rgb2hsl(c1),dk=effDark(),ss=Math.min(70,Math.max(30,s));const hs=(S2,L,al)=>`hsl(${h.toFixed(0)} ${S2}% ${L}%${al!=null?' / '+al:''})`;
 const v={'--ac':a[3],'--ac2':a[4],'--ac-text':dk?hs(Math.min(100,s),68):hs(Math.min(100,s),30),'--ac-soft':`rgba(${c1},${dk?.16:.10})`,'--ac-soft2':`rgba(${c1},${dk?.28:.19})`,'--blob1':dk?'rgba(0,0,0,0)':`rgba(${c1},.20)`,'--blob2':dk?'rgba(0,0,0,0)':`rgba(${c2},.30)`,
  '--on-ac':(1.05/(lum(c1)+.05)>(lum(c1)+.05)/.06)?'#ffffff':hs(ss,8),
  '--bg':dk?'#0a0a0a':hs(ss*.12,96),'--bg-tint':dk?'#0f0f0f':hs(ss*.9,95),'--surface':dk?'rgba(20,20,20,.78)':'rgba(255,255,255,.76)','--solid':dk?'#141414':'#ffffff','--solid-2':dk?'#1e1e1e':hs(ss,97),'--line':dk?'rgba(255,255,255,.10)':hs(ss,35,.12),

const HCOL=['#ff8a3d','#ff5c7a','#ff7ac6','#c084fc','#8b8cff','#4fa8ff','#2dd4f0','#2ee6b0','#4cd964','#b6e35a','#ffd23f','#ff9f80'];
const HEMO=['💧','📖','🏃','🧘','😴','🥗','💪','✍️','🙏','🎯','📵','☀️'];
const HMS=[7,14,30,60,100,200,365,1000];
const hdate=k=>new Date(k+'T12:00:00');
const hdone=(k,id)=>((S.hlog||{})[k]||[]).includes(id);
function hStreak(h){
 const d=new Date();if(!hdone(dkey(d),h.id))d.setDate(d.getDate()-1);let cur=0;
 while(hdone(dkey(d),h.id)){cur++;d.setDate(d.getDate()-1)}
 let best=0,run=0,prev=null;
 for(const k of Object.keys(S.hlog||{}).filter(k=>hdone(k,h.id)).sort()){
  if(prev){const p=hdate(prev);p.setDate(p.getDate()+1);run=dkey(p)===k?run+1:1}else run=1;
  best=Math.max(best,run);prev=k}
 return {cur,best:Math.max(best,cur)}}
function hAny(){const d=new Date();const any=k=>((S.hlog||{})[k]||[]).some(id=>S.habits.some(h=>h.id===id));if(!any(dkey(d)))d.setDate(d.getDate()-1);let c=0;while(any(dkey(d))){c++;d.setDate(d.getDate()-1)}return c}
function hRing(cur,size,sw,big){
 const nx=HMS.find(m=>m>cur)||cur+1,r=(size-sw)/2,C=2*Math.PI*r,p=Math.min(1,cur/nx);
 return `<div class="hring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="hg${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)"/></linearGradient></defs><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#hg${size})" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><div class="hrt"><b${big?' class="big"':''}>${cur}</b>${big?`<small>${t('streak')}</small>`:''}</div></div>`}
function hSmooth(pts,lo,hi){if(pts.length<2)return '';const cl=v=>Math.min(hi,Math.max(lo,v));let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,cl(p1[1]+(p2[1]-p0[1])/6)],c2=[p2[0]-(p3[0]-p1[0])/6,cl(p2[1]-(p3[1]-p1[1])/6)];d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`}return d}
function hStats(k){const hs=S.habits.filter(h=>(h.start||'')<=k);const dn=hs.filter(h=>hdone(k,h.id)).length;return {dn,tot:hs.length}}
function hCaption(k){const s=hStats(k);const dt=hdate(k);return `<b>${dt.toLocaleDateString(dloc(),{weekday:'long'})} ${dt.getDate()}</b> · ${s.dn} ${t('ofN')} ${s.tot}`}
function hChart(days,today){
 const W=400,H=220,pl=26,pr=12,pt=14,pb=24,N=Math.max(1,S.habits.length);
 const list=days.filter(k=>k<=today);if(list.length<1)return '';
 const n=days.length,x=i=>pl+(n<2?0:i*(W-pl-pr)/(n-1)),y=v=>pt+(H-pt-pb)*(1-v/N);
 const pts=list.map((k,i)=>[+x(i).toFixed(1),+y(hStats(k).dn).toFixed(1)]);
 const step=N>6?Math.ceil(N/5):1;let grid='';for(let v=0;v<=N;v+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" class="hax">${v}</text>`;
 const line=hSmooth(pts,y(N),y(0)),area=pts.length>1?`${line} L${pts[pts.length-1][0]},${y(0)} L${pts[0][0]},${y(0)} Z`:'';
 const col=r=>r>=1?'#16a34a':r>=.5?'#fd7903':'#e11d48';
 const dots=list.map((k,i)=>{const s=hStats(k),r=s.tot?s.dn/s.tot:0;return `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4.5" fill="${col(r)}" stroke="var(--solid)" stroke-width="2"/><circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="9" fill="transparent" data-act="hpt" data-id="${k}"/>`}).join('');
 const xl=days.map((k,i)=>(i%Math.ceil(n/10)===0||i===n-1)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" class="hax">${+k.slice(8)}</text>`:'').join('');
 return `<svg viewBox="0 0 ${W} ${H}" class="hchart" role="img"><defs><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#e11d48"/><stop offset=".45" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)"/></linearGradient><linearGradient id="ha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".35"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>${grid}${xl}${area?`<path d="${area}" fill="url(#ha)"/>`:''}<path d="${line}" fill="none" stroke="url(#hl)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`}
V.habits=()=>{
 S.habits=S.habits||[];S.hlog=S.hlog||{};
 const now=new Date(),today=dkey(now),c=memUI.hm||(memUI.hm={y:now.getFullYear(),m:now.getMonth()});
 const dim=new Date(c.y,c.m+1,0).getDate(),days=[...Array(dim)].map((_,i)=>dkey(new Date(c.y,c.m,i+1)));
 const wl=lang==='ar'?['ح','ن','ث','ر','خ','ج','س']:['S','M','T','W','T','F','S'];
 const ts=hStats(today),past=days.filter(k=>k<=today);
 let dn=0,tot=0;past.forEach(k=>{const s=hStats(k);dn+=s.dn;tot+=s.tot});const rate=tot?Math.round(dn*100/tot):0;
 const best=S.habits.reduce((m,h)=>Math.max(m,hStreak(h).best),0);

 if(!S.habits.length)return `<div class="vh"><div><h1 class="h1">${t('habits')}</h1><p class="sub">${t('habitsSub')}</p></div><button class="btn" type="button" data-act="new-habit">${ic('plus')}${t('newHabit')}</button></div>${empty(t('noHabits'),t('noHabitsH'))}`;
 const cards=S.habits.map(h=>{const s=hStreak(h),dd=hdone(today,h.id);return `<div class="card hcard" style="--hc:${h.color}"><div class="hring-w">${hRing(s.cur,64,7,false)}</div><div class="hinf"><b>${esc(h.emoji||'')} ${esc(h.name)}</b><small>${ic('flame')} ${s.cur} ${t('streak')} · ${t('best')} ${s.best}</small></div><button type="button" class="hchk${dd?' on':''}" data-act="htog" data-id="${h.id}" data-d="${today}" aria-label="${t('today')}">${ic('check2')}</button><button type="button" class="ib hmore" data-act="edit-habit" data-id="${h.id}" aria-label="${t('edit')}">${ic('dots')}</button></div>`}).join('');
 const head=`<tr><th class="hn"></th>${days.map(k=>{const dt=hdate(k);return `<th class="${k===today?'tdy':''}"><span>${wl[dt.getDay()]}</span><b>${dt.getDate()}</b></th>`}).join('')}</tr>`;
 const body=S.habits.map(h=>`<tr><th class="hn" style="--hc:${h.color}">${esc(h.emoji||'')} ${esc(h.name)}</th>${days.map(k=>{const on=hdone(k,h.id),fut=k>today;return `<td class="${k===today?'tdy':''}"><button type="button" class="hc${on?' on':''}" style="--hc:${h.color}" ${fut?'disabled':''} data-act="htog" data-id="${h.id}" data-d="${k}" aria-label="${esc(h.name)} ${k}">${on?ic('check2'):''}</button></td>`}).join('')}</tr>`).join('');
 postRender=()=>{const w=$('#hgw');const td=w&&$('th.tdy',w);if(td){w.scrollLeft=lang==='ar'?-(w.scrollWidth-w.clientWidth)+0:0;const r=td.getBoundingClientRect(),wr=w.getBoundingClientRect();w.scrollLeft+=(r.left+r.width/2)-(wr.left+wr.width/2)}};
 const lastK=past.length?past[past.length-1]:null;
 return `<div class="vh"><div><h1 class="h1">${t('habits')}</h1><p class="sub">${t('habitsSub')}</p></div><button class="btn" type="button" data-act="new-habit">${ic('plus')}${t('newHabit')}</button></div>
 ${hero}<div class="hcards">${cards}</div>
 <section class="card sec hsec"><div class="hmn"><button type="button" class="ib" data-act="hprev" aria-label="prev">${ic('chl','flip')}</button><b>${mname}</b><button type="button" class="ib" data-act="hnext" aria-label="next">${ic('chr','flip')}</button></div>

 const EMR=/(\p{Regional_Indicator}{2}|[#*0-9]\ufe0f?\u20e3|\p{Extended_Pictographic}(?:\ufe0f|\p{Emoji_Modifier})?(?:\u200d\p{Extended_Pictographic}(?:\ufe0f|\p{Emoji_Modifier})?)*)/u;

function mergeRects(rs){rs.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);const out=[];for(const r of rs){const l=out[out.length-1];if(l){const ov=Math.min(l[1]+l[3],r[1]+r[3])-Math.max(l[1],r[1]);if(ov>.5*Math.min(l[3],r[3])&&r[0]<=l[0]+l[2]+.015){const x2=Math.max(l[0]+l[2],r[0]+r[2]),y1=Math.min(l[1],r[1]),y2=Math.max(l[1]+l[3],r[1]+r[3]);l[0]=Math.min(l[0],r[0]);l[2]=x2-l[0];l[1]=y1;l[3]=y2-y1;continue}}out.push(r.slice())}return out}

 <div class="cal"><section class="card sec"><div class="cal-g">${wd.map(w=>`<div class="cal-w">${w}</div>`).join('')}${cells}</div></section>

 ${TB('bold','bold','b_bold')}${TB('italic','italic','b_italic')}${TB('underline','underline','b_under')}${TB('strikeThrough','strike','b_strike')}${TB('color','textc','b_color')}${TB('hl','hl','b_hl')}<span class="sep"></span>
 ${TB('justifyLeft','al','b_al')}${TB('justifyCenter','ac','b_ac')}${TB('justifyRight','ar','b_ar')}<span class="sep"></span>
 ${TB('insertUnorderedList','ul','b_ul')}${TB('insertOrderedList','ol','b_ol')}${TB('todo','todo','b_todo')}<span class="sep"></span>
 ${TB('quote','quote','b_quote')}${TB('code','code','b_code')}${TB('call','spark','b_call')}${TB('table','table','b_table')}${TB('hr','minus','b_hr')}${TB('rowp','rowp','b_rowp','class="tbl"')}${TB('colp','colp','b_colp','class="tbl"')}<span class="sep"></span>
 ${TB('link','link','b_link')}${TB('img','image','b_img')}${TB('draw','brush','b_draw')}${TB('clear','x','b_clear')}</div>
 <div class="doc" id="doc" contenteditable="true" spellcheck="true" data-ph="${t('ph')}"></div><div class="sb" id="sbar"></div></article>
 <aside class="card panel"><div class="ptabs">${[['outline','pOutline'],['links','pLinks'],['hist','pHist']].map(([k,l])=>`<button type="button" data-act="ptab" data-id="${k}" class="${memUI.sideTab===k?'on':''}">${t(l)}</button>`).join('')}</div><div class="ol" id="pbody"></div></aside></div>`};
function tagsHtml(n){return n.tags.map(x=>`<span class="tg">#${esc(x)}<button type="button" data-act="rm-tag" data-id="${esc(x)}" aria-label="${t('del')}">${ic('x')}</button></span>`).join('')}

function fixDir(d){d.querySelectorAll('p,h1,h2,h3,li,blockquote,div.callout,td,th').forEach(e=>{if(!e.hasAttribute('dir'))e.setAttribute('dir','auto')})}
function setStatus(s){const e=$('#stat');if(!e)return;e.innerHTML=s==='saving'?ic('clock')+t('saving'):ic('check2')+t('savedNow')}
function docStats(){const d=$('#doc');if(!d)return;const tx=d.innerText||'';const w=tx.trim()?tx.trim().split(/\s+/).length:0;const e=$('#sbar');
 if(e)e.innerHTML=`<span>${ic('file')}${w} ${t('words')}</span><span>${tx.replace(/\s/g,'').length} ${t('chars')}</span><span>${ic('clock')}${Math.max(1,Math.round(w/200))} ${t('readT')}</span>`;
 d.classList.toggle('emp',!tx.trim()&&!d.querySelector('img,table,hr,pre,li'))}
function onDoc(){const d=$('#doc');if(!d)return;fixDir(d);pendingEd=true;clearTimeout(edTimer);setStatus('saving');edTimer=setTimeout(commit,500);docStats();clearTimeout(onDoc.p);onDoc.p=setTimeout(panel,700)}
function commit(){
 clearTimeout(edTimer);pendingEd=false;const n=curNote,d=$('#doc'),ti=$('#nt');if(!n||!d)return;
 const html=d.innerHTML,title=ti?ti.value:n.title;if(html===n.html&&title===n.title){setStatus('saved');return}
 const now=Date.now();
 if(n.html&&n.html!==html&&n.html.length<400000&&(!n.v[0]||now-n.v[0].t>300000)){n.v.unshift({t:now,title:n.title,html:n.html});if(n.v.length>20)n.v.length=20}
 n.html=html;n.title=title;n.updated=now;bump();save();setStatus('saved')}
function flushEditor(){if(pendingEd&&curNote&&$('#doc'))commit()}
function saveSel(){const s=getSelection(),d=$('#doc');if(d&&s.rangeCount&&d.contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange()}
function restoreSel(){const d=$('#doc');if(!d)return;d.focus();if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}}
function ex(c,v){const d=$('#doc');if(!d)return;restoreSel();document.execCommand(c,false,v==null?null:v);onDoc();tbState()}
function ins(html){restoreSel();document.execCommand('insertHTML',false,html);onDoc()}
function closest(tag){const s=getSelection();let n=s.anchorNode;const d=$('#doc');while(n&&n!==d){if(n.nodeType===1&&n.matches(tag))return n;n=n.parentNode}return null}
function tbState(){const tb=$('#tb');if(!tb)return;const d=$('#doc');const s=getSelection();if(!s.anchorNode||!d.contains(s.anchorNode))return;
 ['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList','justifyLeft','justifyCenter','justifyRight'].forEach(c=>{const b=tb.querySelector(`[data-ex="${c}"]`);if(b){let on=false;try{on=document.queryCommandState(c)}catch(e){}b.classList.toggle('on',on)}});
 const td=!!closest('td,th');tb.classList.toggle('intbl',td);let f='p';try{f=(document.queryCommandValue('formatBlock')||'p').toLowerCase().replace(/[<>]/g,'')}catch(e){}$('#fmt').value=['h1','h2','h3'].includes(f)?f:'p'}
function panel(){const b=$('#pbody'),n=curNote,d=$('#doc');if(!b||!n)return;const tab=memUI.sideTab;
 $$('.ptabs button').forEach(x=>x.classList.toggle('on',x.dataset.id===tab));
 if(tab==='outline'){const hs=[...d.querySelectorAll('h1,h2,h3')].filter(h=>h.textContent.trim());b.innerHTML=hs.length?hs.map((h,i)=>`<button type="button" class="l${h.tagName[1]}" data-act="goto-h" data-id="${i}">${esc(h.textContent.trim())}</button>`).join(''):`<div class="empty" style="padding:14px 4px">${t('noOutline')}</div>`}
 else if(tab==='links'){const bl=live().filter(o=>o.id!==n.id&&o.html.includes(`data-note="${n.id}"`));b.innerHTML=`<div class="pop ph" style="position:static;box-shadow:none;border:0;padding:4px 8px;min-width:0">${t('backlinks')}</div>`+(bl.length?bl.map(o=>`<button type="button" data-act="open-note" data-id="${o.id}">${esc(o.icon)} ${esc(o.title||t('untitled'))}</button>`).join(''):`<div class="empty" style="padding:14px 4px">${t('nobl')}</div>`)}
 else{b.innerHTML=n.v.length?n.v.map((v,i)=>`<button type="button" data-act="restore-v" data-id="${i}" title="${t('restoreV')}">${ic('history')} ${rel(v.t)}</button>`).join(''):`<div class="empty" style="padding:14px 4px">${t('noVer')}</div>`}}

function edInit(n){
 const d=$('#doc');d.innerHTML=n.html;fixDir(d);docStats();setStatus('saved');panel();
 try{document.execCommand('styleWithCSS',false,true);document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
 if(!n.title&&!n.html)setTimeout(()=>$('#nt')?.focus(),30);
 d.addEventListener('input',()=>{onDoc();slashCheck()});
 $('#nt').addEventListener('input',()=>{const c=$('#crt');if(c)c.textContent=$('#nt').value||t('untitled');onDoc()});
 $('#nt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();d.focus()}});
 d.addEventListener('keydown',docKey);
 d.addEventListener('click',e=>{
  const a=e.target.closest('a.wl');if(a&&a.dataset.note){e.preventDefault();if(note(a.dataset.note)){flushEditor();openNote(a.dataset.note)}return}
  const l=e.target.closest('a[href]');if(l){e.preventDefault();window.open(l.href,'_blank','noopener')||toast(l.href);return}
  const li=e.target.closest('li');if(li&&e.target===li&&li.parentElement.classList.contains('todo')){const r=li.getBoundingClientRect(),rtl=getComputedStyle(li).direction==='rtl',dx=rtl?r.right-e.clientX:e.clientX-r.left;if(dx<30){if(li.dataset.done)li.removeAttribute('data-done');else li.dataset.done='1';onDoc()}}});
 d.addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;const f=[...cd.files].find(x=>x.type.startsWith('image/'));
  if(f){e.preventDefault();readImg(f).then(u=>u&&ins(`<img src="${u}" alt="">`));return}
  e.preventDefault();const tx=cd.getData('text/plain');if(!tx)return;const html=tx.split(/\n/).map(l=>l.trim()?esc(l):'').join('<br>');document.execCommand('insertHTML',false,html);onDoc()});
 d.addEventListener('drop',e=>{const f=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith('image/'));if(f){e.preventDefault();readImg(f).then(u=>u&&ins(`<img src="${u}" alt="">`))}});
 d.addEventListener('blur',()=>{if(pendingEd)commit()});
 const tb=$('#tb');tb.addEventListener('mousedown',e=>{if(!e.target.closest('select'))e.preventDefault()});
 $('#fmt').addEventListener('change',e=>{restoreSel();ex('formatBlock','<'+e.target.value+'>')});
 $('#tagin').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(e.target)}});
 $('#tagin').addEventListener('blur',e=>addTag(e.target));
}
function addTag(inp){const v=inp.value.trim().replace(/^#/,'').replace(/,/g,'');if(!v||!curNote)return;inp.value='';if(!curNote.tags.includes(v)){curNote.tags.push(v);curNote.updated=Date.now();save();$('#tagsw').innerHTML=tagsHtml(curNote)}}
function docKey(e){
 if(slash){const m=curMenu;if(m&&['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)){e.preventDefault();const bs=[...m.querySelectorAll('button')];let i=bs.findIndex(b=>b.classList.contains('hi'));
  if(e.key==='Escape'){closeMenu();slash=null;return}
  if(e.key==='Enter'){bs[i]?.click();return}
  bs[i]?.classList.remove('hi');i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[i].classList.add('hi');bs[i].scrollIntoView({block:'nearest'});return}}
 if(e.key==='Tab'){const td=closest('td,th');if(td){e.preventDefault();let nx=td.nextElementSibling||td.parentElement.nextElementSibling?.firstElementChild;if(!nx){tblRow();nx=td.parentElement.nextElementSibling?.firstElementChild}if(nx){const r=document.createRange();r.selectNodeContents(nx);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}}}
}
function slashItems(){return[['h1','head','s_h1',()=>ex('formatBlock','<h1>')],['h2','head','s_h2',()=>ex('formatBlock','<h2>')],['h3','head','s_h3',()=>ex('formatBlock','<h3>')],['ul','ul','b_ul',()=>ex('insertUnorderedList')],['ol','ol','b_ol',()=>ex('insertOrderedList')],['todo','todo','b_todo',()=>tool('todo')],['quote','quote','b_quote',()=>tool('quote')],['code','code','b_code',()=>tool('code')],['call','spark','b_call',()=>tool('call')],['table','table','b_table',()=>tool('table')],['hr','minus','b_hr',()=>tool('hr')],['img','image','b_img',()=>tool('img')],['draw','brush','b_draw',()=>tool('draw')],['note','link','s_note',()=>tool('notelink')],['date','cal','s_date',()=>ins(esc(new Date().toLocaleDateString(dloc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'&nbsp;')]]}
function slashCheck(){const s=getSelection();if(!s.rangeCount||!s.isCollapsed){closeSlash();return}const nd=s.anchorNode;if(!nd||nd.nodeType!==3){closeSlash();return}

function graphInit(){
 const cv=$('#gc');if(!cv)return;const wrap=cv.parentElement,dpr=Math.min(2,devicePixelRatio||1),W=wrap.clientWidth,H=wrap.clientHeight;

 const cs=getComputedStyle(document.documentElement),FG=cs.getPropertyValue('--fg').trim(),FG3=cs.getPropertyValue('--fg3').trim(),AC=cs.getPropertyValue('--ac').trim(),LN=cs.getPropertyValue('--fg3').trim();

 ns.forEach((o,i)=>{const re=/data-note="([^"]+)"/g;let m;const seen=new Set();while((m=re.exec(o.n.html))){const j=idx.get(m[1]);if(j!=null&&j!==i&&!seen.has(j)){seen.add(j);links.push([i,j,1]);o.deg++;ns[j].deg++}}});

 const col=o=>{const nb=nbOf(o.n.nb);return nb?NBC[nb.color][0]:NBC.slate[0]};
 function step(){for(let i=0;i<ns.length;i++){const a=ns[i];for(let j=i+1;j<ns.length;j++){const b=ns[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;const f=2600/d2,d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
  a.vx+=(W/2-a.x)*.004;a.vy+=(H/2-a.y)*.004}
  links.forEach(([i,j,w])=>{const a=ns[i],b=ns[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-110)*.012*w;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});

  ns.forEach((o,i)=>{cx.beginPath();cx.arc(o.x,o.y,rad(o)+(i===hov?3:0),0,7);cx.fillStyle=col(o);cx.fill();cx.font='12px Cairo,Outfit,sans-serif';cx.textAlign='center';cx.fillStyle=i===hov?AC:FG;const tt=(o.n.title||t('untitled'));cx.fillText(tt.length>22?tt.slice(0,21)+'…':tt,o.x,o.y+rad(o)+15)})}
 (function loop(){if(!cv.isConnected)return;step();draw();if(++ticks<320)requestAnimationFrame(loop)})();
 const find=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let b=-1,bd=1e9;ns.forEach((o,i)=>{const d=Math.hypot(o.x-x,o.y-y);if(d<rad(o)+8&&d<bd){bd=d;b=i}});return b};

 try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification(x.title,o);return}}catch(e){}

   if(r.gone){S.gone[id]=Math.max(S.gone[id]||0,r.updated||0);const i=S.notes.findIndex(n=>n.id===id);if(i>=0&&S.notes[i].updated<=(r.updated||0)){S.notes.splice(i,1);changed=true}continue}
   if(S.gone[id]&&S.gone[id]>=(r.updated||0))continue;
   let n;try{n=JSON.parse(r.json)}catch(e){continue}
   n.html=sanitize(n.html||'');n.tags=n.tags||[];n.v=(n.v||[]).map(v=>({...v,html:sanitize(v.html||'')}));
   const l=S.notes.find(x=>x.id===id);
   if(!l){S.notes.push(n);changed=true}else if((r.updated||0)>l.updated){Object.assign(l,n);changed=true}}
  for(const n of S.notes){const r=remote[n.id];

  else if(localCh||!rm){const now=Date.now();writes.push([metaRef,{json:JSON.stringify({notebooks:S.notebooks,tasks:S.tasks,habits:S.habits,hlog:S.hlog}),updated:now}]);sy.mu=now;sy.mh=h}
  {const pref=fs.doc(db,'users',u.uid,'meta','profile'),ps=await fs.getDoc(pref),rp=ps.exists()?ps.data():null,pr=S.profile||{},lu=pr.upd||0;
   if(rp&&(rp.updated||0)>lu){let m=null;try{m=JSON.parse(rp.json)}catch(e){}if(m){S.profile={...m,google:pr.google,upd:rp.updated};changed=true;const ab=$('#avb');if(ab){ab.innerHTML=avInner();ab.style.cssText=avStyle()}}}
   else if((pr.name||pr.avatar||pr.banner)&&(!rp||lu>(rp.updated||0))){const json=JSON.stringify({name:pr.name,avatar:pr.avatar,avCol:pr.avCol,banner:pr.banner,bnCol:pr.bnCol,bnFit:pr.bnFit});if(json.length<900000){const now=lu||Date.now();pr.upd=now;writes.push([pref,{json,updated:now}])}}}

/* ---------- app lock (PIN) ---------- */
const LK='spark-lock';
const lkGet=()=>{try{return JSON.parse(localStorage.getItem(LK)||'null')}catch(e){return null}};
const lkSet=o=>{try{o?localStorage.setItem(LK,JSON.stringify(o)):localStorage.removeItem(LK)}catch(e){}};
async function lkHash(pin,salt){const s=salt+':'+pin;try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h}
let lkFail=0,lkUntil=0,lkHiddenAt=0,lkShowing=false;
function askPin({title,sub,validate,cancelable,forgot}){return new Promise(res=>{
 let el=$('#lock');if(el)el.remove();el=document.createElement('div');el.id='lock';document.body.append(el);let pin='',busy=false;const LEN=4;
 el.innerHTML=`<div class="lkw"><div class="lkh">${LOGO()}<h2 id="lkt">${esc(title)}</h2><p id="lks">${esc(sub||'')}</p></div><div class="lkd" id="lkd">${'<i></i>'.repeat(LEN)}</div><div class="lkm" id="lkm" role="alert"></div>
 <div class="lkp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" class="lkx" data-k="${cancelable?'x':''}">${cancelable?t('cancel'):''}</button><button type="button" data-k="0">0</button><button type="button" class="lkx" data-k="b" aria-label="delete">${ic('x')}</button></div>
 ${forgot?`<button type="button" class="lnk" id="lkf">${t('lkForgot')}</button>`:''}</div>`;
 const paint=()=>$$('#lkd i',el).forEach((d,i)=>d.classList.toggle('on',i<pin.length));
 const msg=m=>{$('#lkm',el).textContent=m||''};
 const finish=v=>{el.classList.add('out');setTimeout(()=>el.remove(),200);document.removeEventListener('keydown',kd);res(v)};
 const press=async k=>{if(busy)return;if(k==='x'){finish(null);return}if(k==='b'){pin=pin.slice(0,-1);paint();msg('');return}if(!/^\d$/.test(k)||pin.length>=LEN)return;
  if(validate&&Date.now()<lkUntil){msg(t('lkWait').replace('{n}',Math.ceil((lkUntil-Date.now())/1000)));return}
  pin+=k;paint();if(pin.length<LEN)return;busy=true;
  const r=validate?await validate(pin):true;
  if(r===true){el.classList.add('ok');setTimeout(()=>finish(pin),420)}else{lkFail++;if(validate&&lkFail>=5){lkFail=0;lkUntil=Date.now()+30000}el.classList.add('shake');navigator.vibrate&&navigator.vibrate(60);setTimeout(()=>{el.classList.remove('shake');pin='';paint();busy=false;msg(typeof r==='string'?r:t('lkWrong'))},380)}};
 const kd=e=>{if(/^\d$/.test(e.key)||e.key==='Backspace')press(e.key==='Backspace'?'b':e.key)};document.addEventListener('keydown',kd);
 el.addEventListener('pointerdown',e=>{const b=e.target.closest('.lkp button');if(b&&b.dataset.k){b.classList.remove('pr');void b.offsetWidth;b.classList.add('pr');navigator.vibrate&&navigator.vibrate(8)}});
 el.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&b.dataset.k)press(b.dataset.k)});
 const f=$('#lkf',el);if(f)f.onclick=()=>finish('forgot')})}
async function lkCreate(cancelable=true){
 const p1=await askPin({title:t('lkNew'),sub:t('lkNewS'),cancelable});if(!p1)return false;
 const p2=await askPin({title:t('lkAgain'),sub:'',cancelable,validate:async p=>p===p1?true:t('lkMis')});if(!p2)return false;
 const salt=uid();lkSet({s:salt,h:await lkHash(p1,salt)});toast(t('lkOn'));return true}
const lkCheck=async pin=>{const l=lkGet();return !l||(await lkHash(pin,l.s))===l.h};
async function lkReauth(){
 const p=(S.profile&&S.profile.google);if(!p)return false;
 try{const f=await fb();await f.a.authStateReady();const u=f.a.currentUser;const prov=u&&u.providerData&&u.providerData.some(x=>x.providerId==='password');
  if(prov){const pw=await ask({title:t('lkPw')+' — '+p.email,ph:t('password')});if(!pw)return false;const r=await f.auth.signInWithEmailAndPassword(f.a,p.email,pw);return r.user.uid===p.uid}
  const r=await f.auth.signInWithPopup(f.a,new f.auth.GoogleAuthProvider());return r.user.uid===p.uid}catch(e){toast(t('lkReFail'));return false}}
async function showLock(){
 if(lkShowing||!lkGet())return;lkShowing=true;
 for(;;){const r=await askPin({title:t('lkTitle'),sub:t('lkSub'),validate:lkCheck,forgot:!!(S&&S.profile&&S.profile.google)});
  if(r==='forgot'){if(await lkReauth()){lkSet(null);toast(t('lkOff'));break}continue}break}
 lkShowing=false;lkFail=0}
function lockSuggest(){if(lkGet()||S.lockAsk)return;S.lockAsk=1;save();
 const ov=openModal(`<div class="lksug"><div class="lkic">${ic('lock')}</div><h3>${t('lkSugT')}</h3><p>${t('lkSugS')}</p></div><div class="dlg-a"><button class="btn ghost" data-x type="button">${t('lkLater')}</button><button class="btn" data-ok type="button">${ic('lock')}${t('lkMake')}</button></div>`);
 $('[data-x]',ov).onclick=()=>ov.remove();$('[data-ok]',ov).onclick=async()=>{ov.remove();await lkCreate();if(route==='prefs')render(1)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)lkHiddenAt=Date.now();else if(lkGet()&&lkHiddenAt&&Date.now()-lkHiddenAt>15000)showLock()});

function authErr(e){const c=e&&e.code||'';if(e&&e.status){if(e.status===429)return t(e.error==='many'?'aMany':'aWaitOtp');if(e.error==='code')return t('aCode');if(e.error==='weak')return t('aWeak');return t('aNet')}if(c==='otp/wait')return t('aWaitOtp');if(/invalid-email/.test(c))return t('aEmail');if(/email-already/.test(c))return t('aExists');if(/weak-password/.test(c))return t('aWeak');if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return t('aInvalid');if(/too-many/.test(c))return t('aMany');if(/invalid-action-code|expired-action-code/.test(c))return t('aCode');if(/operation-not-allowed/.test(c))return t('aOff');return t('aNet')}
function authGate(opts={}){return new Promise(resolve=>{
 const el=document.createElement('div');el.id='auth';document.body.appendChild(el);let mode='in',em='',rst={email:'',code:opts.code||'',sent:0},cdT=null;
 const done=()=>{clearInterval(cdT);el.classList.add('out');setTimeout(()=>el.remove(),350);resolve()};
 const finish=async u=>{const p=S.profile=S.profile||{};const nm=u.displayName||(u.email||'').split('@')[0];p.google={uid:u.uid,name:nm,email:u.email||'',photo:u.photoURL||''};if(!p.name)p.name=nm;if(!p.avatar&&u.photoURL)p.avatar=u.photoURL;S.skipAuth=false;await persist();done()};
 const parseCode=v=>{v=(v||'').trim();const m=v.match(/[?&]oobCode=([^&\s]+)/);return m?decodeURIComponent(m[1]):v};
 const head=(i,h,p)=>`<div class="auth-h">${i}<h2>${h}</h2><p>${p}</p></div>`;
 const draw=()=>{clearInterval(cdT);

function palette(){

 let items=[],hi=0;
 const act=[[t('newNote'),'plus',()=>A['new-note']()],[t('newTask'),'check',()=>taskDialog()],[t('qa_daily'),'edit',()=>A['new-daily']()],[t('qa_draw'),'brush',()=>drawDialog()],[t('tplH'),'tpl',()=>go('templates')],[t('home'),'home',()=>go('home')],[t('notes'),'file',()=>go('notes')],[t('tasks'),'check',()=>go('tasks')],[t('calendar'),'cal',()=>go('calendar')],[t('graph'),'graph',()=>go('graph')],[t('prefs'),'sliders',()=>go('prefs')],[t('a_theme'),'moon',()=>A['theme-toggle']()]];
 const build=q=>{q=q.trim().toLowerCase();items=[];
  act.filter(a=>!q||a[0].toLowerCase().includes(q)).slice(0,q?5:7).forEach(a=>items.push({ic:a[1],l:a[0],s:t('palActions'),run:a[2]}));
  const ns=live().filter(n=>!q||(n.title+' '+plain(n.html)).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated).slice(0,q?8:4);
  ns.forEach(n=>items.push({ic:'file',l:(n.icon||'')+' '+(n.title||t('untitled')),s:rel(n.updated),run:()=>openNote(n.id)}));
  if(q)S.tasks.filter(x=>x.title.toLowerCase().includes(q)).slice(0,4).forEach(x=>items.push({ic:'check',l:x.title,s:t('tasks'),run:()=>go('tasks')}));
  hi=0;paint()};
 const paint=()=>{$('#pr',ov).innerHTML=items.length?items.map((it,i)=>`<button type="button" data-i="${i}" class="${i===hi?'hi':''}">${ic(it.ic)}<b>${esc(it.l)}</b><small>${esc(it.s)}</small></button>`).join(''):empty(t('palNone'))};
 const run=i=>{const it=items[i];if(!it)return;ov.remove();it.run()};
 $('#pq',ov).oninput=e=>build(e.target.value);

 build('');$('#pq',ov).focus()}

async function importFiles(files){
 for(const f of files){const ext=(f.name.split('.').pop()||'').toLowerCase();const base=f.name.replace(/\.[^.]+$/,'');
  try{
   if(ext==='pdf'||ext==='docx'){await addDocs([f]);if(route!=='docs')go('docs')}
   else if(f.type.startsWith('image/')){const u=await readImg(f);if(!u)throw 0;insertImageFromImport(u,base)}
   else if(ext==='json'){const j=JSON.parse(await f.text());if(!j||!Array.isArray(j.notes)||!Array.isArray(j.notebooks)){toast(t('badBackup'));continue}
    if(!await sure(t('restoreQ'),t('importBk')))continue;j.notes.forEach(n=>{n.html=sanitize(n.html||'');n.tags=n.tags||[];n.v=(n.v||[]).map(v=>({...v,html:sanitize(v.html||'')}))});S=Object.assign(seed('ar'),j);S.tasks=S.tasks||[];S.habits=S.habits||[];S.hlog=S.hlog||{};S.act=S.act||{};lang=S.lang||lang;applyLang();applyTheme();save();shell();render();toast(t('restored'))}
   else if(ext==='md'||ext==='txt'){const tx=await f.text();const n=newNote({title:base,html:ext==='md'?mdToHtml(tx):tx.split(/\n/).map(l=>`<p>${esc(l)||'<br>'}</p>`).join('')});toast(t('imported'));openNote(n.id)}
   else if(ext==='html'||ext==='htm'){const tx=await f.text();const d=new DOMParser().parseFromString(tx,'text/html');const n=newNote({title:d.title||base,html:sanitize(d.body.innerHTML)});toast(t('imported'));openNote(n.id)}
   else toast(t('importFail'))
  }catch(e){toast(t('importFail'))}}}
function insertImageFromImport(u,base){const n=newNote({title:base,icon:'🖼️',html:`<p><img src="${u}" alt=""></p>`});toast(t('imported'));openNote(n.id)}
