<body>
<title>Spark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Fredoka:wght@500;600&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: glass sidebar + scrolling main column; crimson on white smoke, dark wine variant */
:root{
  --bg:#eeeff1; --bg-tint:#f4f4f6; --surface:rgba(255,255,255,.82); --solid:#fbfbfc; --solid-2:#ebebee; --line:rgba(0,0,0,.09);
  --fg:#1d1d20; --fg2:#5c5c63; --fg3:#8a8a92;
  --ac:#fd7903; --ac2:#fee800; --ac-text:#bd5200; --ac-soft:rgba(253,121,3,.10); --ac-soft2:rgba(253,121,3,.19); --on-ac:#2a1500;
  --ok:#1b9a5f; --warn:#d97a06; --info:#6d4be0;
  --sh:0 14px 34px -18px rgba(0,0,0,.22); --sh-sm:0 4px 14px -6px rgba(0,0,0,.14);
  --blob1:rgba(0,0,0,0); --blob2:rgba(0,0,0,0); --paper:#ffffff; --scrim:rgba(40,20,0,.45);
  --fz:1; --f:'Outfit','Cairo',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --bg-tint:#0f0f0f; --surface:rgba(20,20,20,.78); --solid:#141414; --solid-2:#1e1e1e; --line:rgba(255,255,255,.10);
  --fg:#f2f2f2; --fg2:#b5b5b5; --fg3:#858585;
  --ac:#fd7903; --ac2:#fee800; --ac-text:#ffa238; --ac-soft:rgba(255,150,40,.13); --ac-soft2:rgba(255,150,40,.24); --on-ac:#2a1500;
  --ok:#3cc98a; --warn:#f0a030; --info:#9b85ff;
  --sh:0 14px 34px -16px rgba(0,0,0,.75); --sh-sm:0 4px 14px -6px rgba(0,0,0,.6);
  --blob1:rgba(0,0,0,0); --blob2:rgba(0,0,0,0); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --bg-tint:#0f0f0f; --surface:rgba(20,20,20,.78); --solid:#141414; --solid-2:#1e1e1e; --line:rgba(255,255,255,.10);
  --fg:#f2f2f2; --fg2:#b5b5b5; --fg3:#858585;
  --ac:#fd7903; --ac2:#fee800; --ac-text:#ffa238; --ac-soft:rgba(255,150,40,.13); --ac-soft2:rgba(255,150,40,.24); --on-ac:#2a1500;
  --ok:#3cc98a; --warn:#f0a030; --info:#9b85ff;
  --sh:0 14px 34px -16px rgba(0,0,0,.75); --sh-sm:0 4px 14px -6px rgba(0,0,0,.6);
  --blob1:rgba(0,0,0,0); --blob2:rgba(0,0,0,0); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-size:calc(15px*var(--fz));line-height:1.6;font-family:var(--f);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:10px}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(700px 420px at 85% -5%,var(--blob2),transparent 70%),
  radial-gradient(620px 520px at -5% 105%,var(--blob1),transparent 70%),
  linear-gradient(180deg,var(--bg),var(--bg-tint))}
.ic{width:calc(20px*var(--fz));height:calc(20px*var(--fz));fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}

.app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}

/* sidebar */
.side{display:flex;flex-direction:column;gap:6px;padding:18px 12px 14px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:auto;min-height:0}
.wm{display:flex;flex-direction:column;align-items:center;padding:6px 0 16px}
.wm b{font-size:calc(30px*var(--fz));font-weight:700;letter-spacing:-.5px;line-height:1.1}
.wm b i{font-style:normal;color:var(--ac-text)}
.wm small{color:var(--fg3);font-size:calc(12px*var(--fz));letter-spacing:.4px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;color:var(--fg);font-weight:500;width:100%;text-align:start;transition:background .15s}
.nav:hover{background:var(--ac-soft)}
.nav .ic{color:var(--fg2)}
.nav.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on-ac);box-shadow:var(--sh-sm);font-weight:600}
.nav.on .ic{color:var(--on-ac)}
.nav .bd{margin-inline-start:auto;background:var(--ac);color:var(--on-ac);border-radius:999px;font-size:calc(12px*var(--fz));min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;font-weight:600}
.nav.on .bd{background:var(--on-ac);color:var(--ac2)}
.sp{flex:1}
.stor{padding:12px 14px;border-radius:18px;background:var(--solid);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:calc(13px*var(--fz))}
.stor .tr{display:flex;align-items:center;gap:8px;font-weight:500}
.stor .tr .ic{color:var(--ac-text)}
.bar{height:7px;border-radius:9px;background:var(--ac-soft2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;font-size:calc(12px*var(--fz));color:var(--fg2);padding:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.bad::before{background:var(--warn)}
.theme{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--solid);border:1px solid var(--line)}
.theme button{display:grid;place-items:center;height:34px;border-radius:999px;color:var(--fg3)}
.theme button.on{background:var(--ac-soft2);color:var(--ac-text)}

/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top>*{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding-bottom:14px}
.searchbar{min-width:0;flex:1;max-width:520px;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg3);text-align:start;box-shadow:var(--sh-sm)}
.searchbar span{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.searchbar kbd{font-weight:500;font-size:calc(12px*var(--fz));font-family:var(--f);padding:2px 8px;border-radius:8px;background:var(--ac-soft);color:var(--fg2)}
.tsp{flex:1}
.ib{flex:none;position:relative;display:grid;place-items:center;width:calc(46px*var(--fz));height:calc(46px*var(--fz));border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);color:var(--fg)}
.ib .bd{position:absolute;top:-3px;inset-inline-end:-3px;background:var(--ac);color:var(--on-ac);border-radius:999px;font-size:calc(11px*var(--fz));min-width:20px;height:20px;display:grid;place-items:center;font-weight:600}
.pill{flex:none;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);font-weight:600;font-size:calc(14px*var(--fz))}
.menu-btn{display:none}
.av{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:700;font-size:calc(18px*var(--fz));border:2px solid var(--solid);box-shadow:var(--sh-sm)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:88px;height:88px;font-size:calc(34px*var(--fz))}
.av .ic{width:calc(22px*var(--fz));height:calc(22px*var(--fz))}.av.xl .ic{width:calc(40px*var(--fz));height:calc(40px*var(--fz))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on-ac);font-weight:600;font-size:calc(14px*var(--fz));box-shadow:var(--sh-sm);white-space:nowrap}
.btn.ghost{background:var(--ac-soft);color:var(--ac-text);box-shadow:none}
.btn.danger{background:none;color:var(--ac-text);box-shadow:none;border:1px solid var(--ac-soft2)}
.btn.sm{padding:6px 12px;font-size:calc(13px*var(--fz))}
.btn:disabled{opacity:.5;cursor:default}

.view{flex:1;min-height:0;overflow:auto;padding:2px 2px 28px;scrollbar-width:thin}
.h1{font-size:calc(28px*var(--fz));font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.25}
.sub{color:var(--fg2);margin:2px 0 0}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh .sp{flex:1}
.sec{padding:18px 20px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:calc(18px*var(--fz));font-weight:700}
.sec-h .ic{color:var(--ac-text)}
.sec-h a,.link{margin-inline-start:auto;color:var(--ac-text);font-weight:600;font-size:calc(14px*var(--fz));display:inline-flex;align-items:center;gap:4px}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--ac-soft);color:var(--ac-text);font-size:calc(12.5px*var(--fz));font-weight:600;white-space:nowrap}
.chip.n{background:var(--solid-2);color:var(--fg2)}
.chip.ok{background:rgba(27,154,95,.14);color:var(--ok)}
.chip.warn{background:rgba(217,122,6,.15);color:var(--warn)}
.chip.red{background:var(--ac);color:var(--on-ac)}
.in{width:100%;height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--solid);outline-offset:1px}
select.in{padding-inline-end:8px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;color:var(--on-ac);padding:20px 24px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:radial-gradient(circle at 90% 8%,rgba(255,255,255,.42) 0,rgba(255,255,255,0) 36%),radial-gradient(circle at 8% 125%,rgba(255,255,255,.26) 0,rgba(255,255,255,0) 46%),linear-gradient(115deg,var(--ac) 0%,color-mix(in srgb,var(--ac),var(--ac2)) 52%,var(--ac2) 100%);box-shadow:var(--sh)}
.hero h1{margin:0;font-size:calc(40px*var(--fz));font-weight:800;line-height:1.1;letter-spacing:-.8px;position:relative}
.hero .hd{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.3);backdrop-filter:blur(8px);font-size:calc(13px*var(--fz));font-weight:600;letter-spacing:.3px;position:relative}.hero .hd .ic{width:calc(16px*var(--fz));height:calc(16px*var(--fz))}
.hero .hi{position:absolute;inset-block-start:18px;inset-inline-end:20px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.3);backdrop-filter:blur(8px);display:grid;place-items:center}.hero .hi .ic{width:calc(30px*var(--fz));height:calc(30px*var(--fz))}
.wm .wr{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap}.wm .wai{font-style:normal;font-size:calc(13px*var(--fz));font-weight:700;color:var(--ac-text);letter-spacing:.2px;margin:0;white-space:nowrap}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);font-size:calc(13.5px*var(--fz));font-weight:500;transition:transform .15s}
.qa button:hover{transform:translateY(-2px)}
.qa .ic{width:calc(26px*var(--fz));height:calc(26px*var(--fz));color:var(--ac-text)}

/* notebooks */
.nbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.nbk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;padding:16px 10px;border-radius:20px;color:#fff;text-align:center;box-shadow:var(--sh-sm);transition:transform .15s;font-weight:600}
.nbk:hover{transform:translateY(-3px)}
.nbk .ic{width:calc(34px*var(--fz));height:calc(34px*var(--fz));margin-bottom:6px}
.nbk small{font-weight:400;opacity:.9;font-size:calc(13px*var(--fz))}
.nbk.add{background:var(--ac-soft);border:1.5px dashed var(--ac-soft2);color:var(--ac-text);box-shadow:none}
.nbk .mo{position:absolute;inset-block-end:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);color:#7a0a22;display:grid;place-items:center}
.nbk .mo .ic{width:calc(18px*var(--fz));height:calc(18px*var(--fz));margin:0}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-align:start;width:100%}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--fg3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th{width:48px;height:48px;border-radius:12px;background:var(--ac-soft);display:grid;place-items:center;font-size:calc(24px*var(--fz));flex:none;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;flex:none;color:transparent}
.chk .ic{width:calc(15px*var(--fz));height:calc(15px*var(--fz));stroke-width:3}
.chk.on{background:var(--ac);color:var(--on-ac)}
.t-done .tx b{text-decoration:line-through;color:var(--fg3)}
.empty{padding:26px 10px;text-align:center;color:var(--fg3)}
.empty b{display:block;color:var(--fg2);margin-bottom:4px}
.week{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.stack>*,.cols>*{min-width:0}
.week div{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:calc(12px*var(--fz));color:var(--fg3)}
.week span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week i{display:block;width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:var(--ac-soft2);min-height:6px}
.week .tdy i{background:linear-gradient(180deg,var(--ac),var(--ac2))}
.week em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--fg2);font-weight:600}
.big{display:flex;gap:18px;margin-top:6px}
.big div{flex:1;padding:12px 14px;border-radius:16px;background:var(--solid);border:1px solid var(--line)}
.big b{display:block;font-size:calc(24px*var(--fz));font-variant-numeric:tabular-nums;line-height:1.2}
.big span{color:var(--fg2);font-size:calc(13px*var(--fz))}

/* notes list */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools .in{width:auto;flex:1;min-width:160px;max-width:340px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--solid);border:1px solid var(--line)}
.seg button{width:38px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--fg3)}
.seg .on{background:var(--ac-soft2);color:var(--ac-text)}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchips button{padding:6px 14px;border-radius:999px;background:var(--solid);border:1px solid var(--line);font-size:calc(13.5px*var(--fz));font-weight:500;color:var(--fg2)}
.fchips .on{background:var(--ac);color:var(--on-ac);border-color:transparent}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ngrid.list{grid-template-columns:1fr}
.nc{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);text-align:start;transition:transform .15s;min-width:0}
.nc:hover{transform:translateY(-2px)}
.nc .hd{display:flex;align-items:center;gap:10px}
.nc .ni{font-size:calc(26px*var(--fz));line-height:1}
.nc h3{margin:0;font-size:calc(16px*var(--fz));font-weight:700;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nc p{margin:0;color:var(--fg2);font-size:calc(13.5px*var(--fz));line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.1em}
.nc .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--fg3);font-size:calc(12.5px*var(--fz))}
.nc .st{color:var(--warn)}.nc .st.pn{color:var(--ac)}.nc .st .ic{width:calc(16px*var(--fz));height:calc(16px*var(--fz))}
.ngrid.list .nc{flex-direction:row;align-items:center}
.ngrid.list .nc p{display:none}
.ngrid.list .nc .hd{flex:1}
.mo2{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);flex:none}
.mo2:hover{background:var(--ac-soft)}

/* tasks */
.tadd{display:grid;grid-template-columns:minmax(0,1fr) 140px 110px 140px 120px 140px auto;gap:10px;padding:14px;margin-bottom:14px}
.prio{width:10px;height:10px;border-radius:50%;flex:none}
.p1{background:var(--ok)}.p2{background:var(--warn)}.p3{background:var(--ac)}

/* calendar */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-w{text-align:center;color:var(--fg3);font-size:calc(13px*var(--fz));font-weight:600;padding:6px 0}
.cd{flex-direction:column;aspect-ratio:1;min-height:0;padding:2px;border-radius:14px;align-items:center;justify-content:center;gap:2px;background:var(--solid);border:1px solid var(--line);text-align:start;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cd b{font-weight:600;font-variant-numeric:tabular-nums}
.cd.o{opacity:.45}
.cd.today b{background:var(--ac);color:var(--on-ac);border-radius:50%;width:21px;height:21px;display:grid;place-items:center}
.cd.sel{outline:2px solid var(--ac);outline-offset:-1px}.cd.ev{background:var(--ec);border-color:var(--ec);color:#fff}.cd.ev b{color:#fff}.cd.evl,.cd.evl b{color:#2a2100}.cd.ev.sel{outline:2px solid var(--fg);outline-offset:1px}.cd.ev.today b{background:#fff;color:#222}.cd.ev .dots i{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cd .dots{display:flex;gap:4px;flex-wrap:wrap}

.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;width:100%}.fonts button{padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--solid);text-align:center;font-size:calc(18px*var(--fz))}.fonts button small{display:block;font-size:calc(11px*var(--fz));color:var(--fg3);font-family:system-ui}.fonts button.on{border-color:var(--ac);box-shadow:0 0 0 .5px var(--ac)}
body.aimode .bnav,body.aimode .top{display:none}
body.aimode .view{overflow:hidden;padding:0!important}
body.aimode .aiw{height:100%;min-height:0}
.aiw{display:flex;flex-direction:column;min-height:100%;gap:8px}
.aibar{display:flex;align-items:center;gap:6px;padding:2px 0 4px;flex:none}
.aitabs,.aiseg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--ac-soft);max-width:100%;overflow-x:auto}
.aitabs button,.aiseg button{padding:7px 14px;border-radius:999px;font-size:calc(13.5px*var(--fz));color:var(--fg2);white-space:nowrap;font-weight:600}
.aitabs button.on,.aiseg button.on{background:var(--solid);color:var(--ac-text);box-shadow:var(--sh)}
.aiback{display:none}
.aim{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;padding-bottom:6px;min-height:0}body.aimode .aim{overflow-y:auto}
.aihello{margin:auto;text-align:center;padding:16px 4px;max-width:520px}
.aiorb{width:64px;height:64px;border-radius:22px;margin:0 auto 10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on-ac);box-shadow:var(--sh)}.aiorb .ic{width:calc(30px*var(--fz));height:calc(30px*var(--fz))}
.aihello h2{margin:0 0 4px;font-size:calc(22px*var(--fz))}.aihello p{margin:0 0 16px;color:var(--fg2)}
.aiqg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.aiqg button,.aiql button{display:flex;align-items:center;gap:9px;padding:12px;border-radius:16px;background:var(--solid);border:1px solid var(--line);text-align:start;font-size:calc(14px*var(--fz));font-weight:600;color:var(--fg)}
.aiqg button .ic,.aiql button .ic{color:var(--ac-text);flex:none}
.aiql{display:grid;gap:8px}.aiql .dng{color:#e11d48}
.aib{display:flex;min-width:0}.aib.u{justify-content:flex-end}
.aibb{max-width:min(100%,720px);padding:10px 14px;border-radius:18px;background:var(--solid);border:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.aib.u .aibb{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on-ac);border:0;border-end-end-radius:6px;white-space:pre-wrap}
.aib:not(.u) .aibb{border-end-start-radius:6px;width:100%}
.aibb.err{border-color:#e11d48;color:#e11d48}
.aimd{line-height:1.7;font-size:calc(15px*var(--fz))}.aimd p{margin:.35em 0}.aimd h2,.aimd h3,.aimd h4,.aimd h5{margin:.9em 0 .3em;font-size:1.05em}.aimd h2{font-size:1.2em}
.aimd p,.aimd li,.aimd h2,.aimd h3,.aimd h4,.aimd h5,.aimd blockquote{unicode-bidi:plaintext}
.aimd ul,.aimd ol{margin:.3em 0;padding-inline-start:1.4em}.aimd blockquote{margin:.5em 0;padding:4px 12px;border-inline-start:3px solid var(--ac);background:var(--ac-soft);border-radius:8px}
.aimd pre{background:#0f0f10;color:#eee;padding:10px 12px;border-radius:12px;overflow-x:auto;font-size:calc(13px*var(--fz));direction:ltr;text-align:left}.aimd code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--ac-soft);padding:1px 5px;border-radius:6px}.aimd pre code{background:none;padding:0}
.aimd .eq{font-family:Georgia,serif;font-style:italic;direction:ltr;unicode-bidi:isolate}
.aitb{overflow-x:auto;margin:.5em 0;max-width:100%;-webkit-overflow-scrolling:touch}.aitb table{border-collapse:collapse;width:max-content;min-width:100%;font-size:calc(13px*var(--fz))}.aitb th,.aitb td{border:1px solid var(--line);padding:6px 10px;text-align:start;min-width:96px;max-width:260px;overflow-wrap:normal;word-break:normal;vertical-align:top}.aitb th{background:var(--ac-soft)}
.aia{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.aia button,.aifu button{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:calc(12.5px*var(--fz));color:var(--fg2);background:var(--ac-soft)}.aia button .ic{width:calc(14px*var(--fz));height:calc(14px*var(--fz))}
.aiprov{margin-inline-start:auto;color:var(--fg3);font-size:calc(11px*var(--fz))}
.aifu{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.aifu button{color:var(--ac-text);border:1px solid var(--line);background:var(--solid);text-align:start;padding:7px 12px}
.aisrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cite{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;margin:0 2px;border-radius:999px;font-size:calc(12px*var(--fz));font-weight:700;color:var(--ac-text);background:var(--ac-soft);vertical-align:baseline}
.cite.big{padding:6px 11px;font-size:calc(12.5px*var(--fz));font-weight:600;text-align:start}.cite .ic{width:calc(14px*var(--fz));height:calc(14px*var(--fz))}
.dots{display:inline-flex;gap:4px;margin-inline-end:8px;vertical-align:middle}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:aid 1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes aid{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.aith{color:var(--fg2);font-size:calc(14px*var(--fz))}
.aicomp{flex:none;padding:0;display:flex;flex-direction:column;gap:6px}
.aisc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.aidoc{max-width:100%;padding:6px 10px;font-size:calc(13px*var(--fz));width:auto;min-width:0;flex:1}
.aiin{display:flex;align-items:flex-end;gap:6px;background:var(--solid);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--sh)}
.aiin textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;font:inherit;color:var(--fg);padding:8px 6px;max-height:140px;line-height:1.5}
.aimic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ac-text);background:var(--ac-soft)}.aimic .ic{width:calc(20px*var(--fz));height:calc(20px*var(--fz))}
.vrec{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:30px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--sh);max-width:calc(100% - 24px)}
.vrec .vdot{width:12px;height:12px;border-radius:50%;background:#e11d48;animation:vp 1s infinite}.vrec b{font-variant-numeric:tabular-nums;min-width:38px}.vrec .vst{color:var(--fg2);font-size:calc(13px*var(--fz))}.vrec button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--solid-2);color:var(--fg)}.vrec button.ok{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on-ac)}.vrec .ic{width:calc(19px*var(--fz));height:calc(19px*var(--fz))}.vrec.busy .vdot{background:var(--ac);animation:vs 1s linear infinite;border-radius:3px}
@keyframes vp{50%{transform:scale(.6);opacity:.5}}@keyframes vs{to{transform:rotate(360deg)}}
.tb button.recording,.aimic.recording{background:#e11d48;color:#fff}
.aisend{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on-ac)}.aisend .ic{width:calc(20px*var(--fz));height:calc(20px*var(--fz))}.aisend.stop{background:#e11d48;color:#fff}
.aihl{max-height:55vh;overflow:auto;margin-top:10px;display:grid;gap:6px}.aihr{display:flex;align-items:center;gap:4px;border-radius:14px;padding:2px 4px}.aihr.on{background:var(--ac-soft)}

function B(a){return a.map(s=>{const i=s.indexOf(':');const k=i<0?s:s.slice(0,i),v=i<0?'':s.slice(i+1);const P=v.split('|').map(esc);
 switch(k){
  case'h1':case'h2':case'h3':return `<${k}>${esc(v)}</${k}>`;
  case'p':return `<p>${esc(v)}</p>`;
  case'ul':return '<ul>'+P.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  case'ol':return '<ol>'+P.map(x=>`<li>${x}</li>`).join('')+'</ol>';
  case'todo':return '<ul class="todo">'+P.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  case'done':return '<ul class="todo">'+P.map(x=>`<li data-done="1">${x}</li>`).join('')+'</ul>';
  case'q':return `<blockquote>${esc(v)}</blockquote>`;
  case'call':return `<div class="callout">${esc(v)}</div>`;
  case'hr':return '<hr>';
  case'tbl':{const rows=v.split(';').map(r=>r.split(',').map(esc));return '<table><tbody>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')+'</tr>').join('')+'</tbody></table>'}
  default:return '';
 }}).join('')+'<p><br></p>'}

let S=null,storeOK=true,saveT=null,lastSaved=0;
const memUI={nb:null,tag:null,sort:'updated',mode:'grid',q:'',tf:'all',cal:null,sel:null,sideTab:'outline',kind:'notes'};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('crimson-notes',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function loadState(){
 try{const db=await idb();const v=await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});db.close();if(v)return JSON.parse(v)}catch(e){}
 try{const s=localStorage.getItem('crimson-notes-state');if(s)return JSON.parse(s)}catch(e){}
 return null}
async function persist(){
 const data=JSON.stringify(S);let ok=false;
 try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(data,'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();ok=true}catch(e){}
 if(!ok){try{localStorage.setItem('crimson-notes-state',data);ok=true}catch(e){}}
 storeOK=ok;lastSaved=Date.now();updStorage(data.length);try{window.__pushSync&&window.__pushSync();window.__cloudSync&&window.__cloudSync()}catch(e){}return ok}
function save(now){clearTimeout(saveT);if(now){return persist()}saveT=setTimeout(()=>{persist().then(()=>{const s=$('#stat');if(s&&!pendingEd)setStatus('saved')})},250)}
let usage=0,quota=0;
async function updStorage(len){usage=len||usage;try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();quota=e.quota||0}}catch(e){}const el=$('#stor');if(el)el.innerHTML=storHtml();const sy=$('#sync');if(sy){sy.className='sync'+(storeOK?'':' bad');sy.textContent=storeOK?t('savedDev'):t('noStore')}}
function fmtBytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function storHtml(){const pct=quota?Math.max(3,Math.min(100,usage/quota*100)):Math.max(3,Math.min(100,usage/5242880*100));return `<div class="tr">${ic('folder')}<span>${t('storage')}</span></div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><span style="color:var(--fg2)">${fmtBytes(usage)} ${t('usedOf')}</span>`}

const plain=html=>{const d=document.createElement('div');d.innerHTML=html||'';return (d.innerText||d.textContent||'').replace(/\s+/g,' ').trim()};
const dloc=()=>({ar:'ar-DZ',fr:'fr-FR',es:'es-ES',de:'de-DE'}[lang]||'en-GB');
function rel(ts){const d=(ts-Date.now())/1000,a=Math.abs(d);const f=new Intl.RelativeTimeFormat(dloc(),{numeric:'auto'});
 if(a<60)return f.format(Math.round(d/60)||0,'minute');if(a<3600)return f.format(Math.round(d/60),'minute');if(a<86400)return f.format(Math.round(d/3600),'hour');if(a<86400*30)return f.format(Math.round(d/86400),'day');return new Date(ts).toLocaleDateString(dloc(),{day:'numeric',month:'short',year:'numeric'})}
const fdate=(k,o)=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(dloc(),o||{day:'numeric',month:'short'})};
function dueLabel(k){if(!k)return t('noDate');const td=dkey(),tm=dkey(Date.now()+DAY);if(k===td)return t('today');if(k===tm)return t('tomorrow');return fdate(k)}
function streak(){let n=0,d=Date.now();if(!S.act[dkey(d)])d-=DAY;while(S.act[dkey(d)]){n++;d-=DAY}return n}
function bump(){const k=dkey();S.act[k]=(S.act[k]||0)+1}

/* sanitize imported html */
function sanitize(html){const d=new DOMParser().parseFromString('<body>'+html,'text/html');
 d.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base,svg,math').forEach(e=>e.remove());
 d.body.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();
  if(n.startsWith('on')||((n==='href'||n==='src'||n==='xlink:href')&&(v.startsWith('javascript:')||(v.startsWith('data:')&&!v.startsWith('data:image/png')&&!v.startsWith('data:image/jpeg')&&!v.startsWith('data:image/webp')&&!v.startsWith('data:image/gif')))))e.removeAttribute(a.name)});
  if(e.tagName==='A'&&e.getAttribute('href')&&!e.dataset.note)e.setAttribute('rel','noopener noreferrer')});
 return d.body.innerHTML}

function openModal(html,cls=''){const ov=document.createElement('div');ov.className='ov '+(cls.includes('pal')?'':'');ov.innerHTML=`<div class="dlg ${cls}" role="dialog" aria-modal="true">${html}</div>`;
 ov.addEventListener('mousedown',e=>{if(e.target===ov)(ov._cancel||(()=>ov.remove()))()});$('#layer').append(ov);return ov}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),2400)}
function ask({title,value='',ph='',ok=t('ok')}){return new Promise(res=>{const ov=openModal(`<h3>${esc(title)}</h3><input class="in" id="aq" value="${esc(value)}" placeholder="${esc(ph)}"><div class="dlg-a"><button class="btn ghost" data-x type="button">${t('cancel')}</button><button class="btn" data-ok type="button">${esc(ok)}</button></div>`);
 const i=$('#aq',ov);i.focus();i.select();const done=v=>{ov.remove();res(v)};ov._cancel=()=>done(null);
 $('[data-x]',ov).onclick=()=>done(null);$('[data-ok]',ov).onclick=()=>done(i.value.trim());i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim())}})}
function sure(msg,ok=t('del')){return new Promise(res=>{const ov=openModal(`<h3>${esc(msg)}</h3><div class="dlg-a"><button class="btn ghost" data-x type="button">${t('cancel')}</button><button class="btn" data-ok type="button">${esc(ok)}</button></div>`);
 const done=v=>{ov.remove();res(v)};ov._cancel=()=>done(false);$('[data-x]',ov).onclick=()=>done(false);$('[data-ok]',ov).onclick=()=>done(true);$('[data-ok]',ov).focus()})}
let curMenu=null;
function closeMenu(){if(curMenu){curMenu.remove();curMenu=null}}
function popup(anchor,html,cls=''){closeMenu();const m=document.createElement('div');m.className='pop '+cls;m.innerHTML=html;document.body.append(m);curMenu=m;
 const r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():anchor;const w=m.offsetWidth,h=m.offsetHeight;
 let x=lang==='ar'?r.right-w:r.left;x=Math.max(8,Math.min(x,innerWidth-w-8));let y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);
 m.style.left=x+'px';m.style.top=y+'px';return m}
function menu(anchor,items){const m=popup(anchor,items.map((it,i)=>it==='-'?'<hr>':`<button type="button" data-i="${i}" class="${it.dg?'dg':''}">${it.ic?ic(it.ic):''}<span>${esc(it.l)}</span></button>`).join(''));

/* ---------- markdown / export / import helpers ---------- */
function mdNode(n){
 if(n.nodeType===3)return n.textContent.replace(/\s+/g,' ');
 if(n.nodeType!==1)return '';
 const tag=n.tagName.toLowerCase(),kids=()=>[...n.childNodes].map(mdNode).join('');
 switch(tag){
  case'h1':return '\n# '+kids().trim()+'\n\n';case'h2':return '\n## '+kids().trim()+'\n\n';case'h3':return '\n### '+kids().trim()+'\n\n';
  case'summary':return '\n**'+kids().trim()+'**\n';
  case'details':return '\n'+kids()+'\n';
  case'p':case'div':{const k=kids().trim();if(!k)return '';return n.classList.contains('callout')?'\n> '+k+'\n\n':'\n'+k+'\n'}
  case'br':return '\n';
  case'strong':case'b':return '**'+kids()+'**';
  case'em':case'i':return '*'+kids()+'*';
  case's':case'strike':return '~~'+kids()+'~~';
  case'a':return `[${kids()}](${n.getAttribute('href')||''})`;
  case'img':{const s=n.getAttribute('src')||'';return '![image]('+(s.startsWith('data:')?'embedded-image':s)+')'}
  case'ul':case'ol':{let i=0;const td=n.classList.contains('todo');return '\n'+[...n.children].map(li=>{i++;const pre=tag==='ol'?i+'. ':td?(li.dataset.done?'- [x] ':'- [ ] '):'- ';return pre+mdNode(li).trim()}).join('\n')+'\n\n'}
  case'blockquote':return '\n> '+kids().trim().replace(/\n/g,'\n> ')+'\n\n';
  case'pre':return '\n```\n'+n.textContent.replace(/\n$/,'')+'\n```\n\n';
  case'hr':return '\n---\n\n';
  case'table':{const rows=[...n.querySelectorAll('tr')].map(r=>[...r.children].map(c=>mdNode(c).trim().replace(/\|/g,'/')));if(!rows.length)return '';const w=Math.max(...rows.map(r=>r.length));const line=r=>'| '+Array.from({length:w},(_,i)=>r[i]||'').join(' | ')+' |';return '\n'+line(rows[0])+'\n|'+' --- |'.repeat(w)+'\n'+rows.slice(1).map(line).join('\n')+'\n\n'}
  default:return kids();
 }}
function noteMd(n){const d=document.createElement('div');d.innerHTML=n.html;return '# '+(n.title||t('untitled'))+'\n\n'+mdNode(d).replace(/\n{3,}/g,'\n\n').trim()+'\n'}
function noteHtml(n){return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(n.title)}</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:6px 10px}.callout{background:#fde8ec;padding:12px 16px;border-radius:12px}</style></head><body><h1>${esc(n.title)}</h1>${n.html}</body></html>`}
function mdToHtml(src){
 const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/~~([^~]+)~~/g,'<s>$1</s>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2">$1</a>');
 const lines=src.replace(/\r/g,'').split('\n');let out='',list=null,code=false,buf=[];
 const close=()=>{if(list){out+=list==='ol'?'</ol>':'</ul>';list=null}};
 for(const Ln of lines){
  if(Ln.startsWith('```')){if(code){out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';buf=[];code=false}else{close();code=true}continue}
  if(code){buf.push(Ln);continue}
  let m;
  if((m=/^(#{1,3})\s+(.*)/.exec(Ln))){close();out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if((m=/^\s*[-*]\s+\[( |x)\]\s+(.*)/i.exec(Ln))){if(list!=='todo'){close();out+='<ul class="todo">';list='todo'}out+=`<li${m[1]!==' '?' data-done="1"':''}>${inl(m[2])}</li>`}
  else if((m=/^\s*[-*]\s+(.*)/.exec(Ln))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`}
  else if((m=/^\s*\d+[.)]\s+(.*)/.exec(Ln))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`}
  else if((m=/^>\s?(.*)/.exec(Ln))){close();out+=`<blockquote>${inl(m[1])}</blockquote>`}
  else if(/^-{3,}\s*$/.test(Ln)){close();out+='<hr>'}
  else if(Ln.trim()===''){close()}
  else{close();out+=`<p>${inl(Ln)}</p>`}
 }
 close();if(code)out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';return out+'<p><br></p>'}
function readImg(file,max=1400){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const x=c.getContext('2d');const png=file.type==='image/png'&&file.size<250000;if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(png?'image/png':'image/jpeg',.86))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

let dl=null;
function exportFile(filename,text){
 const fallback=()=>{toast(t('noDl'));const ov=openModal(`<h3>${esc(filename)}</h3><textarea class="in" style="height:260px;padding:10px;font:13px var(--mono)" readonly>${esc(text)}</textarea><div class="dlg-a"><button class="btn" data-x type="button">${t('close')}</button></div>`);$('[data-x]',ov).onclick=()=>ov.remove();$('textarea',ov).select()};
 if(!dl){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:filename.endsWith('.ics')?'text/calendar;charset=utf-8':'text/plain;charset=utf-8'}));a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(t('exported'));return}catch(e){return fallback()}}
 dl.save({filename,data:text}).then(()=>toast(t('exported'))).catch(e=>{if(e&&e.code==='declined')return;if(e&&(e.code==='rate_limited'))return;fallback()})}

function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s*100,l*100]}

/* ---------- app lock (PIN) ---------- */
const LK='spark-lock';
const lkGet=()=>{try{return JSON.parse(localStorage.getItem(LK)||'null')}catch(e){return null}};
const lkSet=o=>{try{o?localStorage.setItem(LK,JSON.stringify(o)):localStorage.removeItem(LK)}catch(e){}};
async function lkHash(pin,salt){const s=salt+':'+pin;try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h}
let lkFail=0,lkUntil=0,lkHiddenAt=0,lkShowing=false;
function askPin({title,sub,validate,cancelable,forgot,bio}){return new Promise(res=>{
 let el=$('#lock');if(el)el.remove();el=document.createElement('div');el.id='lock';document.body.append(el);let pin='',busy=false;const LEN=4;
 el.innerHTML=`<div class="lkw"><div class="lkh">${LOGO()}<h2 id="lkt">${esc(title)}</h2><p id="lks">${esc(sub||'')}</p></div><div class="lkd" id="lkd">${'<i></i>'.repeat(LEN)}</div><div class="lkm" id="lkm" role="alert"></div>
 <div class="lkp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" class="lkx" data-k="${cancelable?'x':''}">${cancelable?t('cancel'):''}</button><button type="button" data-k="0">0</button><button type="button" class="lkx" data-k="b" aria-label="delete">${ic('x')}</button></div>
 ${forgot?`<button type="button" class="lnk" id="lkf">${t('lkForgot')}</button>`:''}${bio?`<button type="button" class="lnk" id="lkb">${ic('finger')} ${t('bioUse')}</button>`:''}</div>`;
 const paint=()=>$$('#lkd i',el).forEach((d,i)=>d.classList.toggle('on',i<pin.length));
 const msg=m=>{$('#lkm',el).textContent=m||''};
 const finish=v=>{el.classList.add('out');setTimeout(()=>el.remove(),200);document.removeEventListener('keydown',kd);res(v)};
 const press=async k=>{if(busy)return;if(k==='x'){finish(null);return}if(k==='b'){pin=pin.slice(0,-1);paint();msg('');return}if(!/^\d$/.test(k)||pin.length>=LEN)return;
  if(validate&&Date.now()<lkUntil){msg(t('lkWait').replace('{n}',Math.ceil((lkUntil-Date.now())/1000)));return}
  pin+=k;paint();if(pin.length<LEN)return;busy=true;
  const r=validate?await validate(pin):true;
  if(r===true){el.classList.add('ok');setTimeout(()=>finish(pin),420)}else{lkFail++;if(validate&&lkFail>=5){lkFail=0;lkUntil=Date.now()+30000}el.classList.add('shake');navigator.vibrate&&navigator.vibrate(60);setTimeout(()=>{el.classList.remove('shake');pin='';paint();busy=false;msg(typeof r==='string'?r:t('lkWrong'))},380)}};
 const kd=e=>{if(/^\d$/.test(e.key)||e.key==='Backspace')press(e.key==='Backspace'?'b':e.key)};document.addEventListener('keydown',kd);
 el.addEventListener('pointerdown',e=>{const b=e.target.closest('.lkp button');if(b&&b.dataset.k){b.classList.remove('pr');void b.offsetWidth;b.classList.add('pr');navigator.vibrate&&navigator.vibrate(8)}});
 el.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&b.dataset.k)press(b.dataset.k)});
 const f=$('#lkf',el);if(f)f.onclick=()=>finish('forgot');const bb=$('#lkb',el);if(bb)bb.onclick=async()=>{if(await bioCheck()){el.classList.add('ok');setTimeout(()=>finish('bio'),300)}}})}
async function lkCreate(cancelable=true){
 const p1=await askPin({title:t('lkNew'),sub:t('lkNewS'),cancelable});if(!p1)return false;
 const p2=await askPin({title:t('lkAgain'),sub:'',cancelable,validate:async p=>p===p1?true:t('lkMis')});if(!p2)return false;
 const salt=uid();lkSet({s:salt,h:await lkHash(p1,salt)});toast(t('lkOn'));return true}
const lkCheck=async pin=>{const l=lkGet();return !l||(await lkHash(pin,l.s))===l.h};
async function lkReauth(){
 const p=(S.profile&&S.profile.google);if(!p)return false;
 try{const f=await fb();await f.a.authStateReady();const u=f.a.currentUser;const prov=u&&u.providerData&&u.providerData.some(x=>x.providerId==='password');
  if(prov){const pw=await ask({title:t('lkPw')+' — '+p.email,ph:t('password')});if(!pw)return false;const r=await f.auth.signInWithEmailAndPassword(f.a,p.email,pw);return r.user.uid===p.uid}
  const r=await f.auth.signInWithPopup(f.a,new f.auth.GoogleAuthProvider());return r.user.uid===p.uid}catch(e){toast(t('lkReFail'));return false}}
async function showLock(){
 if(lkShowing||!lkGet())return;lkShowing=true;
 for(;;){const r=await askPin({title:t('lkTitle'),sub:t('lkSub'),validate:lkCheck,forgot:!!(S&&S.profile&&S.profile.google),bio:bioOn()});
  if(r==='forgot'){if(await lkReauth()){lkSet(null);toast(t('lkOff'));break}continue}break}
 lkShowing=false;lkFail=0}
function lockSuggest(){if(lkGet()||S.lockAsk)return;S.lockAsk=1;save();
 const ov=openModal(`<div class="lksug"><div class="lkic">${ic('lock')}</div><h3>${t('lkSugT')}</h3><p>${t('lkSugS')}</p></div><div class="dlg-a"><button class="btn ghost" data-x type="button">${t('lkLater')}</button><button class="btn" data-ok type="button">${ic('lock')}${t('lkMake')}</button></div>`);
 $('[data-x]',ov).onclick=()=>ov.remove();$('[data-ok]',ov).onclick=async()=>{ov.remove();await lkCreate();if(route==='prefs')render(1)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)lkHiddenAt=Date.now();else if(lkGet()&&lkHiddenAt&&Date.now()-lkHiddenAt>15000)showLock()});

function authErr(e){const c=e&&e.code||'';if(e&&e.status){if(e.status===429)return t(e.error==='many'?'aMany':'aWaitOtp');if(e.error==='code')return t('aCode');if(e.error==='weak')return t('aWeak');return t('aNet')}if(c==='otp/wait')return t('aWaitOtp');if(/invalid-email/.test(c))return t('aEmail');if(/email-already/.test(c))return t('aExists');if(/weak-password/.test(c))return t('aWeak');if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return t('aInvalid');if(/too-many/.test(c))return t('aMany');if(/invalid-action-code|expired-action-code/.test(c))return t('aCode');if(/operation-not-allowed/.test(c))return t('aOff');if(/unauthorized-domain|referer|api-key|app-not-authorized/.test(c))return t('aDom')+' ('+location.hostname+')';if(/network-request-failed/.test(c))return t('aNet');return t('aNet')+(c?' ['+c.replace('auth/','')+']':'')}
function authGate(opts={}){return new Promise(resolve=>{
 const el=document.createElement('div');el.id='auth';document.body.appendChild(el);let mode='in',em='',rst={email:'',code:opts.code||'',sent:0},cdT=null;
 const done=()=>{clearInterval(cdT);el.classList.add('out');setTimeout(()=>el.remove(),350);resolve()};

function palette(){
 const ov=openModal(`<input id="pq" placeholder="${t('palPH')}" autocomplete="off"><div class="rs" id="pr"></div>`,'pal');ov._cancel=()=>ov.remove();
 let items=[],hi=0;
 const act=[[t('newNote'),'plus',()=>A['new-note']()],[t('newTask'),'check',()=>taskDialog()],[t('qa_daily'),'edit',()=>A['new-daily']()],[t('qa_draw'),'brush',()=>drawDialog()],[t('asTitle'),'search',()=>go('asearch')],[t('cTpl'),'file',()=>tplDialog()],[t('home'),'home',()=>go('home')],[t('notes'),'file',()=>go('notes')],[t('tasks'),'check',()=>go('tasks')],[t('calendar'),'cal',()=>go('calendar')],[t('prefs'),'sliders',()=>go('prefs')],[t('a_theme'),'moon',()=>A['theme-toggle']()]];
 const build=q=>{q=q.trim().toLowerCase();items=[];
  act.filter(a=>!q||a[0].toLowerCase().includes(q)).slice(0,q?5:7).forEach(a=>items.push({ic:a[1],l:a[0],s:t('palActions'),run:a[2]}));
  const ns=live().filter(n=>!q||(n.title+' '+(n.lock?'':plain(n.html))).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated).slice(0,q?8:4);
  ns.forEach(n=>items.push({ic:'file',l:(n.icon||'')+' '+(n.title||t('untitled')),s:rel(n.updated),run:()=>openNote(n.id)}));
  if(q)S.tasks.filter(x=>x.title.toLowerCase().includes(q)).slice(0,4).forEach(x=>items.push({ic:'check',l:x.title,s:t('tasks'),run:()=>go('tasks')}));
  hi=0;paint()};
 const paint=()=>{$('#pr',ov).innerHTML=items.length?items.map((it,i)=>`<button type="button" data-i="${i}" class="${i===hi?'hi':''}">${ic(it.ic)}<b>${esc(it.l)}</b><small>${esc(it.s)}</small></button>`).join(''):empty(t('palNone'))};
 const run=i=>{const it=items[i];if(!it)return;ov.remove();it.run()};
 $('#pq',ov).oninput=e=>build(e.target.value);
 $('#pq',ov).onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+items.length)%Math.max(1,items.length);paint();$('.hi',ov)?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){run(hi)}};
 $('#pr',ov).onclick=e=>{const b=e.target.closest('[data-i]');if(b)run(+b.dataset.i)};
 build('');$('#pq',ov).focus()}

async function importFiles(files){
 for(const f of files){const ext=(f.name.split('.').pop()||'').toLowerCase();const base=f.name.replace(/\.[^.]+$/,'');
  try{
   if(ext==='pdf'||ext==='docx'){await addDocs([f]);if(route!=='docs')go('docs')}
   else if(f.type.startsWith('image/')){const u=await readImg(f);if(!u)throw 0;insertImageFromImport(u,base)}
   else if(ext==='json'){const j=JSON.parse(await f.text());if(!j||!Array.isArray(j.notes)||!Array.isArray(j.notebooks)){toast(t('badBackup'));continue}
    if(!await sure(t('restoreQ'),t('importBk')))continue;j.notes.forEach(n=>{n.html=sanitize(n.html||'');n.tags=n.tags||[];n.v=(n.v||[]).map(v=>({...v,html:sanitize(v.html||'')}))});S=Object.assign(seed('ar'),j);S.tasks=S.tasks||[];S.habits=S.habits||[];S.hlog=S.hlog||{};S.act=S.act||{};lang=S.lang||lang;applyLang();applyTheme();save();shell();render();toast(t('restored'))}
   else if(ext==='md'||ext==='txt'){const tx=await f.text();const n=newNote({title:base,html:ext==='md'?mdToHtml(tx):tx.split(/\n/).map(l=>`<p>${esc(l)||'<br>'}</p>`).join('')});toast(t('imported'));openNote(n.id)}
   else if(ext==='html'||ext==='htm'){const tx=await f.text();const d=new DOMParser().parseFromString(tx,'text/html');const n=newNote({title:d.title||base,html:sanitize(d.body.innerHTML)});toast(t('imported'));openNote(n.id)}
   else toast(t('importFail'))
  }catch(e){toast(t('importFail'))}}}
function insertImageFromImport(u,base){const n=newNote({title:base,icon:'🖼️',html:`<p><img src="${u}" alt=""></p>`});toast(t('imported'));openNote(n.id)}

 u.req++;u.by[j.provider]=(u.by[j.provider]||0)+1;if(j.usage){u.tin+=j.usage.in||0;u.tout+=j.usage.out||0}

const STOP=new Set('the a an of to in on at is are was were be been and or but for with by as from that this these those it its what which who how why when where about into than then there their they them you your i we he she his her can could should would will do does did not no yes من في على الى الي عن ان انه انها هو هي هم هذا هذه ذلك تلك التي الذي الذين ما ماذا كيف لماذا متى اين هل كان كانت يكون مع او ثم قد لا لم لن كل بعض اي'.split(' '));
function stem(w){if(/^[؀-ۿ]/.test(w)){if(w.length>4)w=w.replace(/^(وال|بال|كال|فال|لل|ال)/,'');if(w.length>4)w=w.replace(/(ات|ون|ين|ان|ها|هم|ه|ي|ة)$/,'')}else if(w.length>4)w=w.replace(/(ing|ed|es|s)$/,'');return w}

function parsePages(q){q=AR_DIG(q);const m=/(?<![\p{L}\p{N}])(?:ال)?(?:pages?|pp?\.?|صفح[ةات]|ص)\s*[:#]?\s*(\d{1,5})(?:\s*(?:-|–|—|to|through|الى|إلى|حتى)\s*(\d{1,5}))?/iu.exec(q);if(!m)return null;let a=+m[1],b=m[2]?+m[2]:a;if(b<a)[a,b]=[b,a];return[a,b]}
function findBook(q){const nq=' '+norm(q)+' ';let best=null,bs=0;for(const d of S.docs||[]){const nn=norm(d.name).trim();if(nn.length<2)continue;if(nq.includes(' '+nn+' ')||nq.includes(nn)){if(nn.length+100>bs){best=d;bs=nn.length+100}continue}
  const nt=nn.split(/\s+/).filter(w=>w.length>2);if(!nt.length)continue;const hit=nt.filter(w=>nq.includes(w)).length;if(hit/nt.length>=.6&&hit*10>bs){best=d;bs=hit*10}}return best}
const OVERVIEW=/(main ideas?|summar|overview|key (ideas|lessons|points)|whole book|entire book|chapter|الأفكار|الافكار|ملخص|لخص|خلاصة|اهم|أهم|دروس|الفصل|الكتاب كامل|الكتاب كله|عن ماذا)/i;

/* ---------- document text extraction + index ---------- */
const IDX={},IDXP={},CH={},PDFC={};
const idxGet=async id=>{if(IDX[id])return IDX[id];try{const v=await fkv('readonly',s=>s.get('idx:'+id));if(v){IDX[id]=v;return v}}catch(e){}return null};
const idxPut=async(id,o)=>{IDX[id]=o;delete CH[id];try{await fkv('readwrite',s=>s.put(o,'idx:'+id))}catch(e){}};
const idxDel=async id=>{delete IDX[id];delete CH[id];try{await fkv('readwrite',s=>s.delete('idx:'+id))}catch(e){}};
async function getPdf(d){if(DV.pdf&&DV.d&&DV.d.id===d.id)return DV.pdf;if(PDFC[d.id])return PDFC[d.id];const buf=await fget(d.id);if(!buf)throw new Error('missing');const lib=await pdfLib();return PDFC[d.id]=await lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise}
const tick=()=>new Promise(r=>setTimeout(r,0));
function splitVirtual(txt){const paras=txt.replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean);const pages=[],starts=[];let cur='',pos=0,st=0;for(const p of paras){if(cur&&cur.length+p.length>2200){pages.push(cur);starts.push(st);st=pos;cur=''}cur+=(cur?'\n':'')+p;pos+=p.length+1}if(cur){pages.push(cur);starts.push(st)}return{pages,starts,total:Math.max(1,pos)}}
const HEADRX=/^\s*(chapter|section|part|الفصل|الباب|فصل|باب|القسم)\s+\S+/i;
function headOf(txt){const l=txt.split('\n').slice(0,3).map(x=>x.trim()).find(x=>HEADRX.test(x));return l?l.slice(0,90):''}
async function indexDoc(d,prog){
 if(IDXP[d.id])return IDXP[d.id];
 const sig=d.size+':'+d.added;const ex=await idxGet(d.id);if(ex&&ex.sig===sig&&ex.status==='done')return ex;
 return IDXP[d.id]=(async()=>{try{
  let ix={v:1,sig,status:'running',title:d.name,kind:d.kind,pages:[],heads:{},fail:[],ocr:[],virt:false,n:0};
  if(d.kind==='pdf'){
   const pdf=await getPdf(d);ix.n=pdf.numPages;
   for(let i=1;i<=pdf.numPages;i++){
    let txt='';try{const pg=await pdf.getPage(i);const tc=await pg.getTextContent();txt=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').trim();pg.cleanup&&pg.cleanup()}catch(e){}
    ix.pages.push(txt);if(txt.length<15)ix.fail.push(i);const h=headOf(txt);if(h)ix.heads[i]=h;
    if(i%8===0){prog&&prog(i,pdf.numPages);await tick()}}
  }else{
   const buf=await fget(d.id);if(!buf)throw new Error('missing');let txt='';
   if(d.kind==='docx'){await loadJs('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');txt=(await mammoth.extractRawText({arrayBuffer:buf})).value}
   else{const tx=new TextDecoder().decode(buf);txt=d.kind==='html'?(new DOMParser().parseFromString(tx,'text/html').body.textContent||''):tx}
   const v=splitVirtual(txt);ix.pages=v.pages;ix.starts=v.starts;ix.total=v.total;ix.n=v.pages.length;ix.virt=true;v.pages.forEach((p,i)=>{const h=headOf(p);if(h)ix.heads[i+1]=h})}
  ix.status='done';ix.at=Date.now();await idxPut(d.id,ix);return ix
 }finally{delete IDXP[d.id]}})()}
let OCRW=null;
async function ocrPage(d,n){
 if(d.kind!=='pdf')return '';
 if(!OCRW){await loadJs('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');OCRW=await Tesseract.createWorker(['ara','eng'])}
 const pdf=await getPdf(d),pg=await pdf.getPage(n),vp=pg.getViewport({scale:2.2}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
 await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;const r=await OCRW.recognize(cv);cv.width=cv.height=0;return (r.data.text||'').replace(/[ \t]+/g,' ').trim()}
async function ocrFix(d,ix,pagesList,prog){let ok=0;for(const n of pagesList){if(ix.ocr.includes(n))continue;try{const txt=await ocrPage(d,n);ix.ocr.push(n);if(txt.length>=15){ix.pages[n-1]=txt;ix.fail=ix.fail.filter(x=>x!==n);ok++}}catch(e){break}prog&&prog(n)}await idxPut(d.id,ix);return ok}
const ixInfo=ix=>ix?`${ix.n} ${t('ixPages')}`+(ix.fail&&ix.fail.length?` · ${ix.fail.length} ${t('ixNoText')}`:''):t('ixNone');

/* ---------- chunking + BM25 retrieval ---------- */
function chunksOf(d,ix){const k=CH[d.id];if(k&&k.at===ix.at)return k;const chunks=[];
 ix.pages.forEach((txt,i)=>{if(!txt)return;const p=i+1;if(txt.length<=1300){chunks.push({p,t:txt})}else{let cur='';for(const s of txt.split(/(?<=[.!?؟۔\n])\s+/)){if(cur.length+s.length>900&&cur){chunks.push({p,t:cur});cur=''}cur+=(cur?' ':'')+s}if(cur)chunks.push({p,t:cur})}});
 let tot=0;for(const c of chunks){const tf=new Map();for(const w of toks(c.t))tf.set(w,(tf.get(w)||0)+1);c.tf=tf;c.len=Math.max(1,[...tf.values()].reduce((a,b)=>a+b,0));tot+=c.len}
 return CH[d.id]={at:ix.at,chunks,avg:tot/Math.max(1,chunks.length)}}
function bm25(q,sets,K){const qt=[...new Set(toks(q))];if(!qt.length)return[];const all=[];let N=0,tl=0;for(const s of sets){for(const c of s.cs.chunks){all.push({...c,d:s.d,title:s.ix.title||s.d.name});N++;tl+=c.len}}
 if(!N)return[];const avg=tl/N,df={};for(const w of qt)df[w]=all.reduce((n,c)=>n+(c.tf.has(w)?1:0),0);const nq=norm(q).replace(/\s+/g,' ').trim();
 const sc=all.map(c=>{let s=0;for(const w of qt){const f=c.tf.get(w)||0;if(!f)continue;const idf=Math.log(1+(N-df[w]+.5)/(df[w]+.5));s+=idf*(f*2.2)/(f+1.2*(.25+.75*c.len/avg))}if(nq.length>6&&norm(c.t).includes(nq))s+=3;return[s,c]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
 const out=[],seen=new Set();for(const [,c] of sc){const key=c.d.id+':'+c.p;if(seen.has(key)&&out.length>=K/2)continue;seen.add(key);out.push(c);if(out.length>=K)break}return out}
function sample(d,ix,n){const cs=chunksOf(d,ix).chunks;if(!cs.length)return[];const out=[],step=Math.max(1,Math.floor(cs.length/n));for(let i=0;i<cs.length&&out.length<n;i+=step)out.push({...cs[i],d,title:ix.title||d.name});return out}

/* ---------- context builder ---------- */
const BUDGET={concise:6000,balanced:9000,detailed:14000};
const budget=()=>BUDGET[aiS().len]||9000;
function curDocPage(){return DV.pdf?(DV.cur||1):null}
async function ensureIx(d,note){const ex=await idxGet(d.id);if(ex&&ex.sig===d.size+':'+d.added&&ex.status==='done')return ex;AI.note=t('ixRun');aiTick();const ix=await indexDoc(d,(i,n)=>{AI.note=t('ixRun')+' '+i+'/'+n;aiTick()});AI.note='';aiTick();return ix}
async function buildCtx(q,cx,conv){
 const a=aiS(),B=budget(),notes=[],blocks=[];let label='';
 const add=(d,ix,p,txt,cap)=>{blocks.push({k:'S'+(blocks.length+1),doc:d?d.id:null,title:d?(ix&&ix.title||d.name):'',p,text:txt.length>cap?txt.slice(0,cap)+'…':txt})};
 const pages=async(d,ix,x,y)=>{
  if(x>ix.n){throw Object.assign(new Error('range'),{code:'pageRange'})}y=Math.min(y,ix.n);if(y-x>14){notes.push(lang==='ar'?`تم اقتصار الطلب على 15 صفحة (${x}–${x+14}).`:`Limited to 15 pages (${x}–${x+14}).`);y=x+14}
  const per=Math.max(900,Math.floor(B/(y-x+1)));let need=[];for(let p=x;p<=y;p++)if((ix.pages[p-1]||'').length<15&&!ix.virt)need.push(p);
  if(need.length&&d.kind==='pdf'&&need.length<=6){AI.note=t('ixOcrRun');aiTick();try{await ocrFix(d,ix,need)}catch(e){}AI.note='';aiTick()}
  for(let p=x;p<=y;p++){const tx=ix.pages[p-1]||'';if(tx.length<15)notes.push(lang==='ar'?`الصفحة ${p} لا تحتوي نصاً قابلاً للاستخراج (حتى بعد محاولة OCR).`:`Page ${p} has no extractable text (even after OCR).`);else add(d,ix,p,tx,per)}
  label=`${ix.title||d.name} · ${t('aiPg')}${x}${y>x?'–'+y:''}`};
 const search=async(docs,label0)=>{
  const sets=[];for(const d of docs){const ix=await ensureIx(d);sets.push({d,ix,cs:chunksOf(d,ix)})}
  const ov=OVERVIEW.test(q)&&docs.length===1;let hits=bm25(q,sets,ov?4:7);if(ov){const s=sample(docs[0],sets[0].ix,8);for(const c of s)if(!hits.some(h=>h.p===c.p))hits.push(c)}
  let used=0;hits.sort((x,y)=>(x.d.id===y.d.id?x.p-y.p:0));for(const c of hits){const tx=c.t.length>1400?c.t.slice(0,1400)+'…':c.t;if(used+tx.length>B)break;used+=tx.length;add(c.d,sets.find(s=>s.d.id===c.d.id).ix,c.p,tx,1400)}
  label=label0;if(!blocks.length)notes.push(lang==='ar'?'لم يُعثر على مقاطع ذات صلة في الكتب.':'No relevant excerpts were found in the books.')};
 if(cx&&cx.mode==='text'){add(null,null,null,cx.text,B);blocks[0].raw=1;return{blocks,notes,label:''}}
 if(cx&&cx.mode==='sel'){const d=docById(cx.doc);add(d,d&&await idxGet(d.id),cx.p||null,cx.sel,Math.min(B,6000));return{blocks,notes,label:(d?d.name:'')+(cx.p?' · '+t('aiPg')+cx.p:'')}}
 if(cx&&(cx.mode==='pages'||cx.mode==='book')){const d=docById(cx.doc);if(!d)throw Object.assign(new Error('nd'),{code:'noDoc'});const ix=await ensureIx(d);if(cx.mode==='pages')await pages(d,ix,cx.a,cx.b);else await search([d],d.name);return{blocks,notes,label}}
 if(cx&&cx.mode==='lib'){const ds=S.docs||[];if(!ds.length)return{blocks,notes:[t('aiNoDocs')],label:''};await search(ds,t('aiScope2'));return{blocks,notes,label}}
 /* free chat: infer from scope + question */
 if(a.book==='never')return{blocks,notes,label:''};
 const pr=parsePages(q),bk=findBook(q);let d=bk;
 if(!d&&conv&&conv.scope==='doc')d=docById(conv.doc);
 if(!d&&conv&&conv.scope==='lib'&&!pr){const ds=S.docs||[];if(ds.length){await search(ds,t('aiScope2'));return{blocks,notes,label}}}
 if(!d&&pr){d=(route.startsWith('doc-')&&DV.d)||((S.docs||[]).length===1?S.docs[0]:null)}
 if(!d&&a.book==='always'&&route.startsWith('doc-')&&DV.d)d=DV.d;
 if(!d)return{blocks,notes,label:''};
 const ix=await ensureIx(d);
 if(pr)await pages(d,ix,pr[0],pr[1]);else await search([d],d.name);

const LNAME={ar:'Arabic',en:'English',fr:'French',es:'Spanish',tr:'Turkish',de:'German'};
function sysPrompt(hasBook,extra){const a=aiS();
 let s=`You are Spark AI, the assistant inside the Spark notes and reading app. Be accurate, clear and well organised. Use Markdown (lists, tables, code blocks where useful).\n`;
 s+=a.lang==='auto'?`Reply in the same language as the user's latest message (Arabic stays Arabic, English stays English), unless the user asks for another language.\n`:`Always reply in ${LNAME[a.lang]||'the user language'} unless the user explicitly asks for another language.\n`;
 s+={friendly:'Tone: warm, friendly and encouraging.\n',academic:'Tone: precise and academic, with correct terminology.\n',simple:'Tone: very simple language, short sentences, everyday examples.\n'}[a.style]+{concise:'Length: concise — only what is needed.\n',balanced:'Length: balanced.\n',detailed:'Length: detailed and thorough, with examples.\n'}[a.len];
 if(hasBook)s+=`\nBOOK RULES: The user's message includes excerpts from their own books, labeled [S1], [S2]… Base your answer on them first.\n- After each claim taken from an excerpt, cite its label like [S1] (several: [S1][S2]).\n- NEVER invent quotations, page numbers, chapters or claims about the book. If the excerpts do not contain the answer, say so plainly.\n- Keep three things distinct when you mix them: what the book says, general knowledge from you (say so explicitly), and your own interpretation.\n- If a note says a page has no extractable text, tell the user that limitation.\n`;
 s+=extra||'';return s}
const ACTS=`\nYOU CAN ACT inside the app. When the user asks you to write / explain / summarize / plan something AND put or save it in a note (or says "note", "memo", "مذكرة", "ملاحظة", "دوّنه"), output the content inside ONE block, plus one short sentence outside it:\n[[NOTE title="Short title" icon="📚" notebook="optional existing notebook name"]]\n...full content in Markdown...\n[[/NOTE]]\nWhen the user asks for a template / قالب / نموذج for something (study, trip, budget, meeting...), output a reusable, well-structured template (headings, checklists, tables with empty fields) inside:\n[[TEMPLATE title="Template name" icon="📋"]]\n...Markdown...\n[[/TEMPLATE]]\nWhen the user asks to add a task/reminder, output one line per task: [[TASK title="..." due="YYYY-MM-DD or empty" prio="1-3"]]\nFor any to-do list / checklist / قائمة مهام / تشيك ليست, ALWAYS write it as Markdown task items, one per line: - [ ] item (they become a real checklist in the note editor). If the user asks for such a list without saying where, put it in a [[NOTE]] block so it is saved as a note with a real checklist. Use [[TASK]] lines only for tasks with dates/reminders in the Tasks page.\nUse these blocks ONLY when the user asked to create/save something; otherwise answer normally. Never put the blocks inside code fences. The title and content must be in the user's language.`;
const FOLLOW=`\nAt the very end, add exactly one line: FOLLOWUPS: item 1 | item 2 | item 3 — three short follow-up requests the user may want next, written as brief topic phrases of 2–5 words (e.g. "exercises to practice the difference"), NOT as questions, in the user's language.`;
function ctxText(c){if(!c||!c.blocks.length&&!c.notes.length)return'';let s='';if(c.blocks.length&&c.blocks[0].raw)s+='TEXT:\n'+c.blocks[0].text+'\n\n';else if(c.blocks.length)s+='BOOK EXCERPTS:\n'+c.blocks.map(b=>`[${b.k}]${b.title?' ('+b.title+(b.p?', page '+b.p:'')+')':''}\n${b.text}`).join('\n\n')+'\n\n';if(c.notes.length)s+='NOTES: '+c.notes.join(' ')+'\n\n';return s}

/* ---------- markdown renderer (safe: escape first) ---------- */
function aiMd(src,srcs){
 const inl=s=>esc(s).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/~~([^~]+)~~/g,'<s>$1</s>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\$([^$\n]{1,80})\$/g,'<span class="eq">$1</span>');
 const lines=String(src||'').replace(/\r/g,'').split('\n');let out='',list=null,code=false,buf=[],i=0;
 const close=()=>{if(list){out+=list==='ol'?'</ol>':'</ul>';list=null}};
 while(i<lines.length){const Ln=lines[i];
  if(/^```/.test(Ln)){if(code){out+='<pre dir="ltr"><code>'+esc(buf.join('\n'))+'</code></pre>';buf=[];code=false}else{close();code=true}i++;continue}
  if(code){buf.push(Ln);i++;continue}
  if(/^\s*\|.*\|\s*$/.test(Ln)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1])){close();const rows=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++}
   const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));const hd=cells(rows[0]);const bd=rows.slice(2).map(cells);
   out+=`<div class="aitb"><table><thead><tr>${hd.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${bd.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue}
  let m;
  if((m=/^(#{1,4})\s+(.*)/.exec(Ln))){close();const n=Math.min(4,m[1].length)+1;out+=`<h${n}>${inl(m[2])}</h${n}>`}
  else if((m=/^\s*[-*•]\s+\[( |x|X)\]\s+(.*)/.exec(Ln))){if(list!=='todo'){close();out+='<ul class="todo">';list='todo'}out+=`<li${m[1]!==' '?' data-done="1"':''}>${inl(m[2])}</li>`}
  else if((m=/^\s*[-*•]\s+(.*)/.exec(Ln))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`}
  else if((m=/^\s*\d+[.)]\s+(.*)/.exec(Ln))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`}
  else if((m=/^>\s?(.*)/.exec(Ln))){close();out+=`<blockquote>${inl(m[1])}</blockquote>`}
  else if(/^\s*([-*_])\1{2,}\s*$/.test(Ln)){close();out+='<hr>'}
  else if(Ln.trim()===''){close()}
  else{close();out+=`<p>${inl(Ln)}</p>`}
  i++}
 close();if(code)out+='<pre dir="ltr"><code>'+esc(buf.join('\n'))+'</code></pre>';
 if(srcs&&srcs.length)out=out.replace(/\[(S\d+(?:\s*[,;،]\s*S\d+)*)\]/g,(all,g)=>g.split(/\s*[,;،]\s*/).map(k=>{const s=srcs.find(x=>x.k===k);return s?`<button type="button" class="cite" data-cite="${esc(s.doc)}" data-p="${s.p||''}">${s.p?t('aiPg')+s.p:'↗'}</button>`:''}).join(''));
 return out}
function aiOpenSrc(docId,p){const d=docById(docId);if(!d){toast(t('e_noDoc'));return}document.querySelectorAll('.ov').forEach(o=>o.remove());memUI.dvgo=p?+p:null;if(route==='doc-'+docId&&DV.d&&DV.d.id===docId){aiGoPage(+p);memUI.dvgo=null}else go('doc-'+docId)}
async function aiGoPage(p){if(!p)return;const v=$('#view');if(!v)return;if(DV.pdf){const pg=$(`.pg[data-p="${p}"]`,$('#dvb'));if(pg){v.scrollTop+=pg.getBoundingClientRect().top-v.getBoundingClientRect().top-70}}

function jparse(s){s=String(s||'').replace(/```(?:json)?/gi,'');const a=s.search(/[\[{]/);if(a<0)return null;const e=Math.max(s.lastIndexOf(']'),s.lastIndexOf('}'));if(e<a)return null;let j=s.slice(a,e+1);try{return JSON.parse(j)}catch(x){try{return JSON.parse(j.replace(/,\s*([\]}])/g,'$1'))}catch(y){return null}}}
async function aiStudy(kind,o){

 try{
  const cx=o.cx;let ctx;try{ctx=await buildCtx('',cx,null)}catch(e){throw e}
  if(!ctx.blocks.length)throw Object.assign(new Error('empty'),{code:'noText',msg:ctx.notes[0]});
  const n=Math.min(15,Math.max(3,+o.count||8)),diff={easy:'easy',medium:'medium',hard:'hard'}[o.diff]||'medium';
  const lg=a.lang==='auto'?'Write in the same language as the source text.':`Write in ${LNAME[a.lang]}.`;
  let ins;
  if(kind==='cards')ins=`Create ${n} flashcards from the text. ${lg} Return ONLY a JSON array: [{"q":"question or term","a":"concise answer","s":"S1"}] where "s" is the excerpt label the card comes from.`;
  else if(kind==='quiz'){const ty={mcq:'only multiple-choice',tf:'only true/false',short:'only short-answer',mix:'a mix of multiple-choice, true/false and short-answer'}[o.type||'mix'];ins=`Create ${n} ${diff}-difficulty quiz questions (${ty}) from the text. ${lg} Return ONLY a JSON array of objects: {"type":"mcq"|"tf"|"short","q":"...","options":["..","..","..",".."] (mcq only),"answer": for mcq the 0-based index number; for tf true or false; for short a model answer string,"explain":"why","s":"S1"}.`}
  else ins=`Extract difficult terms and build a glossary of up to ${n} entries from the text. ${lg} Return ONLY a JSON array: [{"term":"","def":"clear definition","ctx":"short phrase from the text where it appears","ex":"one example","s":"S1"}].`;
  const res=await aiCall({system:'You are a precise study-material generator. Output valid JSON only, no commentary, no code fences.',messages:[{role:'user',content:ctxText(ctx)+ins}],maxTokens:1900,temperature:.3,signal:AI.ac.signal});
  const arr=jparse(res.text);if(!Array.isArray(arr)||!arr.length)throw Object.assign(new Error('bad'),{code:'parse'});
  const pg=s=>{const b=ctx.blocks.find(x=>x.k===s);return b&&b.p?b.p:null},doc=ctx.blocks.find(b=>b.doc);
  const items=arr.slice(0,n).map(x=>({...x,p:pg(x.s),doc:doc?doc.doc:null,title:doc?doc.title:''}));
  return{items,label:ctx.label,notes:ctx.notes,prov:res.provider}
 }finally{AI.busy=false;AI.ac=null;AI.note='';aiTick()}}

/* image prep: resize to a vision-friendly JPEG + small thumbnail */
async function aiPrepImg(file){const url=URL.createObjectURL(file);try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
 const enc=(max,q)=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};
 let full=enc(1280,.8);if(full.length>800000)full=enc(1024,.7);if(full.length>850000)full=enc(768,.6);return{full,th:enc(160,.6)}}finally{URL.revokeObjectURL(url)}}

   const done=a!=null&&(q.type!=='short'||a==='done');
   root.innerHTML=head(`${i+1} / ${items.length}`)+`<div class="soq" dir="auto">${esc(q.q)}</div>${srcLine(q)}<div class="soos">${body}</div>${a!=null&&q.explain?`<div class="soex" dir="auto"><b>${t('stExpl')}:</b> ${esc(q.explain)}</div>`:''}${done||(q.type==='short'&&a==='done')?`<div class="dlg-a"><button class="btn" data-so="next" type="button">${t('stNext')}</button></div>`:''}`}

/* ===== Settings: grouped accordion ===== */
const _prefs3=V.prefs;
const PGR=[['look','sliders','pgLook','pgLookD',/set-lang|set-fz|set-font|set-theme|set-acc|set-desk|c-nav|c-home|c-tb|tpl|data-id="font"|data-id="acc"/],
 ['ai','ai','pgAi','pgAiD',/aiset|ai-off|ai-clear/],
 ['acc','lock','pgAcc','pgAccD',/signout|lock-|bio-|pw-reset|del-acct|sync-now/],
 ['data','down','pgData','pgDataD',/export-all|import|bk-|zip-all|reset/],
 ['tools','bell','pgTools','pgToolsD',/set-vlang|pray|notif|pwa/]];
V.prefs=()=>{const h=_prefs3();const tp=document.createElement('template');tp.innerHTML=h;
 const head=tp.content.querySelector('.vh');const rows=[...tp.content.querySelectorAll('.rw')];
 const bk={};PGR.forEach(g=>bk[g[0]]=[]);
 rows.forEach(r=>{const x=r.outerHTML;let k=null;for(const g of PGR){if(g[4].test(x)){k=g[0];break}}if(!k)k=/pwaT|setKeys/.test(x)||r.textContent.includes(t('setKeys'))?'data':'tools';bk[k].push(x)});
 const op=memUI.pg||(memUI.pg={});
 return (head?head.outerHTML:'')+PGR.map(g=>`<details class="card pgrp" data-g="${g[0]}"${op[g[0]]?' open':''}><summary><span class="pgi">${ic(g[1])}</span><span class="pgt"><b>${t(g[2])}</b><small>${t(g[3])}</small></span>${ic('chd')}</summary><div class="set pgx">${bk[g[0]].join('')}</div></details>`).join('')};
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.classList&&d.classList.contains('pgrp')){(memUI.pg||(memUI.pg={}))[d.dataset.g]=d.open}},true);

 pgAi:['المساعد الذكي','AI assistant'],pgAiD:['إعدادات الذكاء الاصطناعي والمحادثات','AI settings and conversations'],
 pgAcc:['الحساب والأمان','Account & security'],pgAccD:['الحساب، القفل، البصمة، المزامنة','Account, lock, biometrics, sync'],
 pgData:['البيانات والنسخ الاحتياطي','Data & backup'],pgDataD:['تصدير، استرجاع، مسح','Export, restore, erase'],
 pgTools:['الصوت والتنبيهات والتطبيق','Voice, alerts & app'],pgToolsD:['لغة الصوت، الصلاة، التنبيهات، التثبيت','Voice language, prayer, notifications, install']});

/* zoom + long-press lock */
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
(()=>{let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300&&!e.target.closest('input,textarea,[contenteditable="true"]'))e.preventDefault();lt=n},{passive:false})})();
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea,[contenteditable="true"]'))e.preventDefault()});

/* live update: poll build id, save, reload */
(()=>{const BUILD='0cecd8f7d3';let busy=0;
 async function chk(){if(busy||!navigator.onLine)return;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!j.v||j.v===BUILD||BUILD==='0cecd8f7d3')return;busy=1;
  try{save()}catch(e){}
  const go=async()=>{try{const rg=await navigator.serviceWorker.getRegistration();if(rg){await rg.update();const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}location.reload()};
  toast(t('updNew'));const wait=()=>{const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea,[contenteditable="true"]')&&Date.now()-(window.__lastKey||0)<4000){setTimeout(wait,2000);return}setTimeout(go,1200)};wait()}catch(e){}}
 document.addEventListener('keydown',()=>{window.__lastKey=Date.now()},true);
 setInterval(chk,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});window.addEventListener('focus',chk);window.addEventListener('online',chk);setTimeout(chk,5000)})();
Object.assign(L,{updNew:['يوجد تحديث جديد، جارٍ التحديث…','New update available, updating…']});

/* notification actions from the service worker */
try{navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{const m=e.data||{};if(m.type!=='notif'||!S)return;const x=S.tasks.find(y=>y.id===m.id);if(x){if(m.action==='done'){x.done=true;x.rt=null}else if(m.action==='snooze'){x.rt=Date.now()+600000}save();remPend=remPend.filter(i=>i!==m.id);$('#remov')?.remove();render(1)}})}catch(e){}

})();
